<!-- ❤️ FIGURA ANATÓMICA: CAPAS DE LA PARED CARDÍACA Y DEL PERICARDIO -->
<svg width="500" height="420" xmlns="http://www.w3.org/2000/svg" style="font-family:'Segoe UI',sans-serif">
  <!-- Fondo -->
  <rect width="100%" height="100%" fill="#f8f9fa" rx="15" ry="15"/>

  <!-- Título -->
  <text x="250" y="35" font-size="20" font-weight="bold" fill="#102461" text-anchor="middle">
    Capas de la Pared Cardíaca y del Pericardio
  </text>

  <!-- Leyenda de colores -->
  <rect x="340" y="60" width="20" height="20" fill="#fcd5b4"/><text x="365" y="75" font-size="13">Endocardio</text>
  <rect x="340" y="85" width="20" height="20" fill="#f8cbad"/><text x="365" y="100" font-size="13">Miocardio</text>
  <rect x="340" y="110" width="20" height="20" fill="#c6e0b4"/><text x="365" y="125" font-size="13">Epicardio</text>
  <rect x="340" y="135" width="20" height="20" fill="#ddebf7"/><text x="365" y="150" font-size="13">Cavidad pericárdica</text>
  <rect x="340" y="160" width="20" height="20" fill="#b4c6e7"/><text x="365" y="175" font-size="13">Pericardio seroso parietal</text>
  <rect x="340" y="185" width="20" height="20" fill="#9dc3e6"/><text x="365" y="200" font-size="13">Pericardio fibroso</text>

  <!-- Capas representadas (de adentro hacia afuera) -->
  <rect x="100" y="80" width="140" height="40" fill="#fcd5b4" stroke="#000" stroke-width="0.5"/>
  <rect x="90" y="120" width="160" height="60" fill="#f8cbad" stroke="#000" stroke-width="0.5"/>
  <rect x="80" y="180" width="180" height="40" fill="#c6e0b4" stroke="#000" stroke-width="0.5"/>
  <rect x="70" y="220" width="200" height="20" fill="#ddebf7" stroke="#000" stroke-width="0.5"/>
  <rect x="60" y="240" width="220" height="40" fill="#b4c6e7" stroke="#000" stroke-width="0.5"/>
  <rect x="50" y="280" width="240" height="40" fill="#9dc3e6" stroke="#000" stroke-width="0.5"/>

  <!-- Etiquetas -->
  <text x="60" y="105" font-size="14" fill="#333">Endocardio</text>
  <text x="60" y="155" font-size="14" fill="#333">Miocardio</text>
  <text x="60" y="205" font-size="14" fill="#333">Epicardio</text>
  <text x="60" y="235" font-size="14" fill="#333">Cavidad pericárdica</text>
  <text x="60" y="265" font-size="14" fill="#333">Pericardio seroso parietal</text>
  <text x="60" y="305" font-size="14" fill="#333">Pericardio fibroso</text>

  <!-- Flecha de orientación -->
  <line x1="280" y1="90" x2="280" y2="310" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="290" y="200" font-size="13" fill="#333" transform="rotate(90,290,200)">De interna a externa</text>

  <!-- Definición de la flecha -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="3" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>

  <!-- Firma institucional -->
  <text x="250" y="380" font-size="11" fill="#555" text-anchor="middle">
    SITE-RUTA LATAM · PMAP – Sistema Integrado de Trazabilidad Educativa
  </text>
</svg>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📊 SITE·RUTA LATAM – Diagnóstico Institucional ICFES</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body { font-family: 'Segoe UI', sans-serif; background: #f7faff; color: #222; margin: 20px; text-align: center; }
h1 { color: #003366; font-size: 1.8em; margin-bottom: 5px; }
h2 { color: #00509e; }
#summary { background: #e9f5ff; border-left: 6px solid #004d99; border-radius: 6px; padding: 10px 15px; width: 75%; margin: 15px auto; text-align: left; }
input[type="file"] { margin: 15px; }
table { width: 95%; margin: 20px auto; border-collapse: collapse; font-size: 14px; }
th { background: #002855; color: white; padding: 8px; text-align: center; }
td { border: 1px solid #ccc; padding: 6px; text-align: center; }
tr:nth-child(even) { background: #f1f5f9; }
canvas { margin: 25px; max-width: 550px; }
#charts-container { display: flex; justify-content: center; flex-wrap: wrap; }
.alert { font-weight: bold; color: white; padding: 4px 8px; border-radius: 5px; }
.alert.azul { background: #004d99; }   /* N4 / B1 */
.alert.verde { background: #007f5f; }  /* N3 / A2 */
.alert.ambar { background: #f4a300; }  /* N2 / A1 */
.alert.rojo { background: #c1121f; }   /* N1 / PreA1 */
button { background: #0077b6; color: white; padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; margin-top: 10px; }
button:hover { background: #004d73; }
.small { font-size:12px; opacity:.8 }
</style>
</head>
<body>
<h1>📈 Diagnóstico Institucional SITE·RUTA LATAM</h1>
<h2 id="schoolTitle">Resultados Saber 11 – (cargue un archivo)</h2>

<input type="file" id="fileInput" accept=".xlsx, .csv">
<div id="summary"></div>
<div id="output"></div>

<div id="charts-container">
  <canvas id="barChart"></canvas>
  <canvas id="radarChart"></canvas>
  <canvas id="pieChart"></canvas>
</div>

<button id="downloadExcel" style="display:none;">📗 Descargar Excel Técnico</button>

<script>
const fileInput = document.getElementById("fileInput");
const btnDownload = document.getElementById("downloadExcel");
const schoolTitleEl = document.getElementById("schoolTitle");

fileInput.addEventListener("change", handleFile);

let lastWorkbookAoA = null;   // DATOS (AOA crudo)
let lastJson = null;          // DATOS (JSON)
let lastStats = null;         // Resultado estadístico
let detectedSchool = "Institución";

async function handleFile(e) {
  const file = e.target.files[0];
  if (!file) return;

  const data = await file.arrayBuffer();
  const workbook = XLSX.read(data, { type: "array" });
  const firstSheet = workbook.Sheets[workbook.SheetNames[0]];

  // AoA para hoja DATOS (respeta encabezados/orden original)
  const aoa = XLSX.utils.sheet_to_json(firstSheet, { header: 1, defval: "" });
  const json = XLSX.utils.sheet_to_json(firstSheet, { defval: "" });

  lastWorkbookAoA = aoa;
  lastJson = json;

  detectedSchool = inferSchoolName(file.name, json);
  schoolTitleEl.textContent = `Resultados Saber 11 – ${detectedSchool}`;

  const stats = processResults(json);
  lastStats = stats;

  renderTable(stats);
  renderCharts(stats);
  renderSummary(stats);

  btnDownload.style.display = "inline";
  btnDownload.onclick = () => downloadExcel(detectedSchool, aoa, stats, json);
}

function inferSchoolName(filename, json) {
  // 1) Busca columnas típicas con el nombre de la institución
  const candidates = ["institucion", "institución", "colegio", "establecimiento", "ie", "institucion educativa", "institución educativa"];
  if (json && json.length) {
    const keys = Object.keys(json[0] || {});
    const map = keys.reduce((acc,k)=>{ acc[norm(k)]=k; return acc; }, {});
    for (const c of candidates) {
      const hit = Object.keys(map).find(k => k.includes(norm(c)));
      if (hit) {
        const val = (json[0][map[hit]]||"").toString().trim();
        if (val) return val.toUpperCase();
      }
    }
  }
  // 2) Fallback: desde el nombre del archivo
  const base = filename.replace(/\.[^.]+$/,"");
  // quita sufijos comunes
  const clean = base.replace(/(_?SITE[-·]RUTA.*)$/i,"").replace(/(_?\d{4,4}.*)$/,"").replace(/[_-]+/g," ").trim();
  if (clean) return clean.toUpperCase();
  return "INSTITUCIÓN EDUCATIVA";
}

function norm(t){
  return t.toString().normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"");
}

function processResults(data) {
  // Mapea columnas por nombre flexible
  const headers = Object.keys(data[0]||{}).map(h => [norm(h), h]);

  function findCol(fragmentList){
    for (const [n,h] of headers) {
      for (const f of fragmentList) {
        if (n.includes(norm(f))) return h;
      }
    }
    return null;
  }

  const areasDef = {
    "Lectura Crítica": { cols: ["lectura critica - puntaje","lectura critica","lectura","critica"], isEnglish:false },
    "Matemáticas": { cols: ["matematicas - puntaje","matematicas"], isEnglish:false },
    "Ciencias Sociales y Ciudadanas": { cols: ["sociales y ciudadanas - puntaje","sociales y ciudadanas","sociales"], isEnglish:false },
    "Ciencias Naturales": { cols: ["ciencias naturales - puntaje","ciencias naturales","naturales"], isEnglish:false },
    "Inglés": { cols: ["ingles - puntaje","ingles","inglés - puntaje","inglés"], isEnglish:true }
  };

  const stats = {};
  const ALL = []; // para promedio global

  for (const areaName of Object.keys(areasDef)) {
    const fcols = areasDef[areaName].cols;
    const hit = findCol(fcols);
    if (!hit) continue;

    const vals = data.map(r => Number(r[hit])).filter(v => Number.isFinite(v) && v >= 0);
    const niveles = vals.map(v => getNivel(areaName, v));
    stats[areaName] = { puntajes: vals, niveles };

    // Para global, sumamos todas las áreas en su escala 0-100 (incl. inglés ya viene 0-100)
    ALL.push(...vals);
  }

  // Global (promedio, mediana/desv no obligatorios, pero útil para tablero)
  stats["Global"] = {
    puntajes: ALL,
    niveles: computeGlobalLevels(stats) // devuelve N1–N4 + inglés por separado
  };

  return stats;
}

function getNivel(area, p) {
  if (area === "Inglés") {
    if (p <= 36) return "Pre A1";
    if (p <= 57) return "A1";
    if (p <= 70) return "A2";
    return "B1";
  } else {
    if (p <= 40) return "N1";
    if (p <= 55) return "N2";
    if (p <= 70) return "N3";
    return "N4";
  }
}

function getColor(nivel) {
  if (nivel.includes("N4") || nivel.includes("B1")) return "azul";
  if (nivel.includes("N3") || nivel.includes("A2")) return "verde";
  if (nivel.includes("N2") || nivel.includes("A1")) return "ambar";
  return "rojo";
}

function mean(arr){ return arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : 0; }
function median(arr){
  if(!arr.length) return 0;
  const s = [...arr].sort((a,b)=>a-b);
  const mid = Math.floor(s.length/2);
  return s.length%2 ? s[mid] : (s[mid-1]+s[mid])/2;
}
function stdevPop(arr){
  if(!arr.length) return 0;
  const m = mean(arr);
  const v = arr.reduce((acc,x)=> acc + Math.pow(x-m,2), 0) / arr.length;
  return Math.sqrt(v);
}

function pct(part, total){ return total ? +( (part/total)*100 ).toFixed(1) : 0; }

function computeDistribution(areaName, stats){
  const s = stats[areaName];
  if(!s || !s.puntajes.length) return [];
  const n = s.puntajes.length;
  if (areaName === "Inglés") {
    const buckets = ["Pre A1","A1","A2","B1"];
    return buckets.map(b => {
      const f = s.niveles.filter(x=>x===b).length;
      return { area: areaName, nivel: b, freq: f, pct: pct(f,n) };
    });
  } else {
    const buckets = ["N1","N2","N3","N4"];
    return buckets.map(b => {
      const f = s.niveles.filter(x=>x===b).length;
      return { area: areaName, nivel: b, freq: f, pct: pct(f,n) };
    });
  }
}

function computeGlobalLevels(stats){
  // Para “Global” solo necesitamos porcentajes agregados al construir la hoja,
  // pero retornamos una lista vacía para mantener misma estructura.
  return [];
}

/* ======== UI ======== */
function renderSummary(stats) {
  const allVals = stats["Global"]?.puntajes || [];
  const promGlobal = mean(allVals).toFixed(1);
  let nivelGlobal = "";
  const pg = Number(promGlobal);
  if (pg <= 40) nivelGlobal = "Nivel 1 (Bajo)";
  else if (pg <= 55) nivelGlobal = "Nivel 2 (Básico)";
  else if (pg <= 70) nivelGlobal = "Nivel 3 (Alto)";
  else nivelGlobal = "Nivel 4 (Superior)";
  let colorGlobal = getColor(nivelGlobal);

  document.getElementById("summary").innerHTML = `
    <strong>📊 Resumen Institucional:</strong><br>
    Institución: <b>${detectedSchool}</b><br>
    Promedio global (todas las áreas): <b>${promGlobal}</b> puntos<br>
    Nivel predominante: <span class="alert ${colorGlobal}">${nivelGlobal}</span><br>
    <span class="small">Rangos oficiales: N1:0–40, N2:41–55, N3:56–70, N4:71–100 · Inglés: Pre A1:0–36, A1:37–57, A2:58–70, B1:71–100</span>
  `;
}

function renderTable(stats) {
  let html = `<table><tr><th>Área</th><th>N Est.</th><th>Media</th><th>Mediana</th><th>Desv.Est.</th><th>Distribución (%)</th><th>Nivel Predominante</th><th>Diagnóstico</th></tr>`;
  for (const area of Object.keys(stats)) {
    if (area === "Global") continue;
    const vals = stats[area].puntajes;
    if (!vals.length) continue;
    const n = vals.length;
    const media = mean(vals).toFixed(1);
    const med = median(vals).toFixed(1);
    const desv = stdevPop(vals).toFixed(1);

    const niveles = stats[area].niveles;
    const count = {};
    niveles.forEach(nv => count[nv] = (count[nv]||0)+1);

    let dist = "";
    if (area === "Inglés") {
      dist = ["Pre A1","A1","A2","B1"].map(k => `${k}:${pct(count[k]||0,n)}%`).join(", ");
    } else {
      dist = ["N1","N2","N3","N4"].map(k => `${k}:${pct(count[k]||0,n)}%`).join(", ");
    }

    const pred = Object.entries(count).sort((a,b)=>b[1]-a[1])[0]?.[0] || "—";
    const color = getColor(pred);
    const diagText = {
      azul: "🟦 Desempeño consolidado",
      verde: "🟩 Buen nivel de logro",
      ambar: "🟧 En proceso de mejora",
      rojo: "🟥 Riesgo institucional"
    }[color] || "—";

    html += `<tr><td>${area}</td><td>${n}</td><td>${media}</td><td>${med}</td><td>${desv}</td><td>${dist}</td><td>${pred}</td><td><span class="alert ${color}">${diagText}</span></td></tr>`;
  }
  html += `</table>`;
  document.getElementById("output").innerHTML = html;
}

function renderCharts(stats) {
  const labels = Object.keys(stats).filter(a=>a!=="Global");
  const medias = labels.map(a => mean(stats[a].puntajes));

  // Barras
  new Chart(document.getElementById("barChart"), {
    type: "bar",
    data: {
      labels,
      datasets: [{
        label: "Media por área",
        data: medias,
        backgroundColor: ["#004d99","#007f5f","#f4a300","#c1121f","#66ccff"]
      }]
    },
    options: { responsive: true, scales: { y: { beginAtZero: true, max: 100 } }, plugins: { legend: { display: false } } }
  });

  // Radar
  new Chart(document.getElementById("radarChart"), {
    type: "radar",
    data: {
      labels,
      datasets: [{
        label: "Media Institucional",
        data: medias,
        fill: true,
        backgroundColor: "rgba(0, 86, 179, 0.2)",
        borderColor: "#004d99",
        pointBackgroundColor: "#0066cc"
      }]
    },
    options: { scales: { r: { beginAtZero: true, max: 100 } } }
  });

  // Pastel global N1–N4 (no inglés)
  const nonEng = Object.keys(stats).filter(a=>a!=="Inglés" && a!=="Global");
  const agg = {N1:0,N2:0,N3:0,N4:0}, total=nonEng.reduce((acc,a)=>acc+stats[a].niveles.length,0);
  for (const a of nonEng) stats[a].niveles.forEach(nv=>{ if(agg[nv]!=null) agg[nv]++; });
  new Chart(document.getElementById("pieChart"), {
    type: "pie",
    data: {
      labels: ["Nivel 1","Nivel 2","Nivel 3","Nivel 4"],
      datasets: [{ data: [agg.N1,agg.N2,agg.N3,agg.N4], backgroundColor: ["#c1121f","#f4a300","#007f5f","#004d99"] }]
    },
    options: { plugins: { legend: { position: "bottom" } } }
  });
}

/* ======== EXCEL (3 hojas) ======== */
function buildSheetInstitucional(stats){
  // Encabezado fijo con ambos bloques (N1–N4 y MCER)
  const header = ["Área","N Est.","Media","Mediana","Desv. Est.","N1 (%)","N2 (%)","N3 (%)","N4 (%)","Pre A1 (%)","A1 (%)","A2 (%)","B1 (%)"];
  const rows = [header];

  const areaOrder = ["Lectura Crítica","Matemáticas","Ciencias Sociales y Ciudadanas","Ciencias Naturales","Inglés"];
  const englishOnly = ["Pre A1","A1","A2","B1"];

  areaOrder.forEach(area=>{
    const s = stats[area];
    if(!s || !s.puntajes.length) return;
    const n = s.puntajes.length;
    const media = mean(s.puntajes).toFixed(1);
    const med = median(s.puntajes).toFixed(1);
    const desv = stdevPop(s.puntajes).toFixed(1);

    const count = {};
    s.niveles.forEach(nv => count[nv] = (count[nv]||0)+1);

    const N1 = area==="Inglés" ? 0 : pct(count["N1"]||0, n);
    const N2 = area==="Inglés" ? 0 : pct(count["N2"]||0, n);
    const N3 = area==="Inglés" ? 0 : pct(count["N3"]||0, n);
    const N4 = area==="Inglés" ? 0 : pct(count["N4"]||0, n);

    const PreA1 = area==="Inglés" ? pct(count["Pre A1"]||0,n) : 0;
    const A1    = area==="Inglés" ? pct(count["A1"]||0,n)     : 0;
    const A2    = area==="Inglés" ? pct(count["A2"]||0,n)     : 0;
    const B1    = area==="Inglés" ? pct(count["B1"]||0,n)     : 0;

    rows.push([area,n,media,med,desv,N1,N2,N3,N4,PreA1,A1,A2,B1]);
  });

  // Fila Global (agregada)
  const allAreas = Object.keys(stats).filter(a=>a!=="Global" && a!=="Inglés");
  const allVals = stats["Global"]?.puntajes||[];
  const gMedia = mean(allVals).toFixed(1);
  // mediana y desv global (no imprescindibles)
  const gMed = "—";
  const gDesv = "—";

  // N1–N4 global (solo áreas no inglés)
  let gCount = {N1:0,N2:0,N3:0,N4:0}, gN = 0;
  allAreas.forEach(a=>{
    const ss = stats[a];
    gN += ss.niveles.length;
    ss.niveles.forEach(nv=>{ if(gCount[nv]!=null) gCount[nv]++; });
  });
  const gN1 = pct(gCount.N1,gN);
  const gN2 = pct(gCount.N2,gN);
  const gN3 = pct(gCount.N3,gN);
  const gN4 = pct(gCount.N4,gN);

  // MCER global (desde inglés)
  let eCount = {"Pre A1":0,"A1":0,"A2":0,"B1":0}, eN = 0;
  if (stats["Inglés"]) {
    eN = stats["Inglés"].niveles.length;
    stats["Inglés"].niveles.forEach(nv=>{ if(eCount[nv]!=null) eCount[nv]++; });
  }
  const gPreA1 = pct(eCount["Pre A1"], eN);
  const gA1    = pct(eCount["A1"], eN);
  const gA2    = pct(eCount["A2"], eN);
  const gB1    = pct(eCount["B1"], eN);

  rows.push(["Global", allVals.length, gMedia, gMed, gDesv, gN1, gN2, gN3, gN4, gPreA1, gA1, gA2, gB1]);

  return XLSX.utils.aoa_to_sheet(rows);
}

function buildSheetDistribucion(stats){
  const header = ["Área","Nivel","Frecuencia","Porcentaje"];
  const rows = [header];
  const order = ["Lectura Crítica","Matemáticas","Ciencias Sociales y Ciudadanas","Ciencias Naturales","Inglés"];
  order.forEach(area=>{
    const dist = computeDistribution(area, stats);
    dist.forEach(r=> rows.push([r.area, r.nivel, r.freq, r.pct]));
  });
  return XLSX.utils.aoa_to_sheet(rows);
}

function downloadExcel(schoolName, aoaDatos, stats, json) {
  const wb = XLSX.utils.book_new();

  // Hoja 1: DATOS (AOA tal cual)
  const wsDatos = XLSX.utils.aoa_to_sheet(aoaDatos);
  XLSX.utils.book_append_sheet(wb, wsDatos, "DATOS");

  // Hoja 2: INSTITUCIONAL
  const wsInst = buildSheetInstitucional(stats);
  XLSX.utils.book_append_sheet(wb, wsInst, "INSTITUCIONAL");

  // Hoja 3: DISTRIBUCIÓN
  const wsDist = buildSheetDistribucion(stats);
  XLSX.utils.book_append_sheet(wb, wsDist, "DISTRIBUCIÓN");

  const safeName = String(schoolName || "INSTITUCION")
      .replace(/[\\\/:*?"<>|]+/g,"").replace(/\s+/g,"_");
  const filename = `${safeName}_SITE-RUTA_Institucional.xlsx`;
  XLSX.writeFile(wb, filename);
}
</script>
</body>
</html>

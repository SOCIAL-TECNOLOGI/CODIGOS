/* ============================================================================
   3. UTILIDADES
   ============================================================================ */
function toTitleCase(str){
  return str
    ? str.toLowerCase().split(" ").map(w => w.charAt(0).toUpperCase()+w.slice(1)).join(" ")
    : "";
}

/* Detectar cabecera de RESPONSES (fila que tiene "Nombre" y "Apellido") */
function findHeaderRowResponses(rows){
  for(let i=0;i<rows.length;i++){
    const row = rows[i] || [];
    const lower = row.map(c => c ? c.toString().toLowerCase() : "");
    const hasNombre   = lower.some(c => c.includes("nombre"));
    const hasApellido = lower.some(c => c.includes("apellido"));
    if(hasNombre && hasApellido){
      return i; // índice 0-based
    }
  }
  return 0; // fallback
}

/* Buscar columna con includes + excludes */
function findColumnFlexible(headers, mustInclude, mustNotInclude=[]){
  return headers.findIndex(h => {
    if(!h) return false;
    const s = h.toString().toLowerCase();
    const okInc = mustInclude.some(k => s.includes(k));
    const bad   = mustNotInclude.some(k => s.includes(k));
    return okInc && !bad;
  });
}

/* Extraer verbo desde cabeceras tipo [VERBO] o (VERBO) */
function extractVerbo(raw){
  if(!raw) return null;
  const text = raw.toString();
  let m = text.match(/\[(.*?)\]/) || text.match(/\((.*?)\)/);
  return (m ? m[1] : text).trim().toUpperCase();
}

function handleFile(e){
  const file = e.target.files[0];
  if(!file) return;

  const reader = new FileReader();
  reader.onload = function(evt){
    const data = new Uint8Array(evt.target.result);
    const workbook = XLSX.read(data, {type:'array'});

    /* ---------- 5.1. Identificar hojas SUMMARY y RESPONSES ---------- */
    const summarySheetName  = workbook.SheetNames.find(n => n.toLowerCase().includes("summary"));
    const responsesSheetName = workbook.SheetNames.find(n => n.toLowerCase().includes("responses"));

    if(!summarySheetName || !responsesSheetName){
      alert("No se encontraron las hojas 'Summary Report' y 'Responses' en el archivo.");
      return;
    }

    const sheetSummary   = workbook.Sheets[summarySheetName];
    const sheetResponses = workbook.Sheets[responsesSheetName];

    const jsSummary   = XLSX.utils.sheet_to_json(sheetSummary,  {header:1});
    const jsResponses = XLSX.utils.sheet_to_json(sheetResponses,{header:1});

    /* ---------- 5.2. PROCESAR SUMMARY (verbos y niveles) ---------- */
    verbosGlobal   = [];
    resumenExport  = [];
    resumenVerbos  = [];
    let statsVerbos = [];

    for(let i=0;i<jsSummary.length;i++){
      const row = jsSummary[i] || [];
     const verbCell = limpiarCelda(row[1]);


      if(typeof verbCell === "string" && verbCell.trim()){
        const verbo = verbCell.toString().trim().toUpperCase();
        if(!nivelesCorrectos[verbo]) continue; // ignorar verbos que no están en la tabla

        // En ambos archivos, porcentajes están en las columnas 2,4,6,8 (índices 2,4,6,8)
        let p1 = parseFloat(row[2] || 0);
        let p2 = parseFloat(row[4] || 0);
        let p3 = parseFloat(row[6] || 0);
        let p4 = parseFloat(row[8] || 0);

        // Si vinieran como 0-100 en vez de 0-1, normalizamos:
        if(p1 > 1 || p2 > 1 || p3 > 1 || p4 > 1){
          p1 /= 100; p2 /= 100; p3 /= 100; p4 /= 100;
        }

        const nivelCorrecto = nivelesCorrectos[verbo];

        const niveles = [p1,p2,p3,p4];
        const maxVal  = Math.max(...niveles);
        const pred    = niveles.indexOf(maxVal) + 1;

        const mean = 1*p1 + 2*p2 + 3*p3 + 4*p4;
        const variance = p1*Math.pow(1-mean,2)
                       + p2*Math.pow(2-mean,2)
                       + p3*Math.pow(3-mean,2)
                       + p4*Math.pow(4-mean,2);

        verbosGlobal.push(verbo);
        resumenVerbos.push({
          verbo,
          nivelCorrecto,
          p1, p2, p3, p4,
          pred
        });

        statsVerbos.push({
          verbo,
          mean,
          std: Math.sqrt(variance)
        });
      }
    }

    // Preparar datos para exportar a Excel
    resumenExport = resumenVerbos.map(v => ({
      Verbo: v.verbo,
      "Nivel Correcto": "Nivel " + v.nivelCorrecto,
      "%N1": (v.p1*100).toFixed(1) + "%",
      "%N2": (v.p2*100).toFixed(1) + "%",
      "%N3": (v.p3*100).toFixed(1) + "%",
      "%N4": (v.p4*100).toFixed(1) + "%",
      Predominante: "Nivel " + v.pred
    }));

    // Render de tabla global de verbos

    htmlTabla += "<table><tr><th>Verbo</th><th>Nivel Correcto</th><th>%N1</th><th>%N2</th><th>%N3</th><th>%N4</th><th>Pred.</th></tr>";

          <td>Nivel ${v.nivelCorrecto}</td>
          <td>${(v.p1*100).toFixed(1)}%</td>
          <td>${(v.p2*100).toFixed(1)}%</td>
          <td>${(v.p3*100).toFixed(1)}%</td>
          <td>${(v.p4*100).toFixed(1)}%</td>
          <td>Nivel ${v.pred}</td>
        </tr>`;
    });
    htmlTabla += "</table>";
    document.getElementById("tablaResultados").innerHTML = htmlTabla;

    /* ---------- 5.3. PROCESAR RESPONSES (lista de docentes) ---------- */
    if(!jsResponses.length){
      alert("La hoja 'Responses' está vacía o no se pudo leer.");
      return;
    }

    const headerRowIdx = findHeaderRowResponses(jsResponses);
    const headers = jsResponses[headerRowIdx] || [];

    const idxNombre   = findColumnFlexible(headers, ["nombre"], ["recopilador"]);
    // Buscar todas las columnas que contengan "apellido"
const idxApellidosTodos = headers
  .map((h, i) => ({ h: h?.toString().toLowerCase() || "", i }))
  .filter(col => col.h.includes("apellido"))
  .map(col => col.i);

    const idxTelefono = findColumnFlexible(headers, ["teléfono","telefono"]);
    const idxCorreo   = findColumnFlexible(headers, ["correo"]);
    const idxPuntaje  = findColumnFlexible(headers, ["puntuación","puntaje","score"]);

    // Detectar columnas de verbos
    indicesVerbos = [];
    nombresVerbos = [];
    headers.forEach((h,i) => {
      if(!h) return;
      const text = h.toString();
      if(text.toLowerCase().includes("dimensión") || /\[.*?\]/.test(text) || /\(.*?\)/.test(text)){
        const verbo = extractVerbo(text);
        if(verbo && nivelesCorrectos[verbo]){
          indicesVerbos.push(i);
          nombresVerbos.push(verbo);
        }
      }
    });

    // Construir arreglo de docentes

      const row = jsResponses[i] || [];
      if(idxNombre < 0) continue;
      const nombreRaw = row[idxNombre];
      if(!nombreRaw) continue;

     // Unir todos los apellidos encontrados
let apellidosRaw = idxApellidosTodos
  .map(i => row[i] ? row[i].toString() : "")
  .filter(v => v.trim() !== "")
  .join(" ");

      const telRaw       = (idxTelefono >= 0) ? row[idxTelefono] : "";
      const correoRaw    = (idxCorreo   >= 0) ? row[idxCorreo]   : "";
      const puntRaw      = (idxPuntaje  >= 0) ? row[idxPuntaje]  : 0;

      docentes.push({
        nombre:    toTitleCase(nombreRaw.toString()),
        apellidos: toTitleCase((apellidosRaw || "").toString()),
        telefono:  telRaw   ? telRaw.toString()   : "-",
        correo:    correoRaw? correoRaw.toString(): "-",
        puntaje:   parseFloat(puntRaw) || 0,
        respuestas: row.map(c => limpiarCelda(c))

      });
    }

    // Render tabla de docentes
    let htmlDoc = "<h2>👩‍🏫 Docentes</h2><table>";
    htmlDoc += "<tr><th>Nombre</th><th>Apellidos</th><th>Teléfono</th><th>Correo</th><th>Puntaje</th></tr>";

          <td>${d.telefono || "-"}</td>
          <td>${d.correo || "-"}</td>
          <td>${d.puntaje}</td>
        </tr>`;
    });
    htmlDoc += "</table>";
    document.getElementById("tablaResponses").innerHTML = htmlDoc;

    // Llenar select de docentes
    const select = document.getElementById("docenteSelect");

    docentes.forEach((d,i) => {
      select.innerHTML += `<option value="${i}">${d.nombre} ${d.apellidos}</option>`;
    });


// =======================
//  CÁLCULO DE PUNTAJES
// =======================
const puntajes = docentes.map(d => parseFloat(d.puntaje) || 0);

  };

  reader.readAsArrayBuffer(file);
}

function buildHistogramData(values, binSize=5){
  if(!values.length) return {labels:[], counts:[]};

  const min = Math.min(...values);
  const max = Math.max(...values);
  const start = Math.floor(min/binSize)*binSize;
  const end   = Math.ceil(max/binSize)*binSize;

  const bins = [];
  for(let b=start; b<=end; b+=binSize){
    bins.push([b, b+binSize]);
  }

  const counts = new Array(bins.length).fill(0);
  values.forEach(v => {
    let idx = Math.floor((v - start)/binSize);
    if(idx < 0) idx = 0;
    if(idx >= counts.length) idx = counts.length - 1;
    counts[idx]++;
  });

  return {
    labels: bins.map(([a,b]) => `${a}-${b}`),
    counts
  };
}

function renderTresGraficos(puntajes, statsVerbos){
  // Distribución de puntajes
  const hist = buildHistogramData(puntajes, 5);
  if(chartDistribucion) chartDistribucion.destroy();
  chartDistribucion = new Chart(document.getElementById("chartDistribucion"),{
    type: "bar",
    data: {
      labels: hist.labels,
      datasets: [{
        label: "Docentes",
        data: hist.counts,
        backgroundColor: "rgba(29,78,216,0.7)"
      }]
    },
    options: { responsive: true, scales:{y:{beginAtZero:true}} }
  });

  // Top por media
  const topMedia = statsVerbos.slice().sort((a,b) => b.mean - a.mean).slice(0,10);
  if(chartTopMedia) chartTopMedia.destroy();
  chartTopMedia = new Chart(document.getElementById("chartTopMedia"),{
    type: "bar",
    data: {
      labels: topMedia.map(x => x.verbo),
      datasets: [{
        label: "Media",
        data: topMedia.map(x => x.mean),
        backgroundColor: "#65a30d"
      }]
    },
    options:{ indexAxis: "y" }
  });

  // Top por desviación estándar
  const topVar = statsVerbos.slice().sort((a,b) => b.std - a.std).slice(0,10);
  if(chartTopVar) chartTopVar.destroy();
  chartTopVar = new Chart(document.getElementById("chartTopVar"),{
    type: "bar",
    data: {
      labels: topVar.map(x => x.verbo),
      datasets: [{
        label: "DE",
        data: topVar.map(x => x.std),
        backgroundColor: "#d97706"
      }]
    },
    options:{ indexAxis: "y" }
  });
}

// ================= HELPER PARA INFO DE VERBOS =================
function getVerboInfo(verbo) {
  verbo = verbo.trim().toUpperCase();
  for (let dim in VERBOS_INFO) {
    for (let nivel in VERBOS_INFO[dim]) {
      for (let item of VERBOS_INFO[dim][nivel]) {
        if (item.verbo.toUpperCase() === verbo) {
          return {
            dimension: dim,
            nivel: parseInt(nivel),
            definicion: item.definicion,
            referencia: item.referencia
          };
        }
      }
    }
  }
  if (VERBOS_TRANSVERSALES[verbo]) {
    return VERBOS_TRANSVERSALES[verbo];
  }
  return null;
}

function mostrarInforme() {
  const idx = document.getElementById("docenteSelect").value;
  if (idx === "") return;

  docenteActual = docentes[idx];

  const promedio = (
    docentes.reduce((a, b) => a + parseFloat(b.puntaje || 0), 0) /
    docentes.length
  ).toFixed(1);

  let resultadosDim = {
    SABER: { aciertos: 0, total: 0, detalle: [] },
    HACER: { aciertos: 0, total: 0, detalle: [] },
    SER: { aciertos: 0, total: 0, detalle: [] }
  };

  let correctos = [];
  let erroresGraves = [];

  for (let i = 0; i < nombresVerbos.length; i++) {
    const verbo = nombresVerbos[i];
    const colIdx = indicesVerbos[i];

    let valorCrudo = docenteActual.respuestas[colIdx];
    let respuesta = null;
    if (valorCrudo !== undefined && valorCrudo !== null) {
      let limpio = valorCrudo.toString().trim().replace(/[^0-9]/g, "");
      respuesta = limpio ? parseInt(limpio) : null;
    }
    const correcto = nivelesCorrectos[verbo];

    // hallar dimensión
    let dim = null;
    for (let d in DATA) {
      for (let nivel in DATA[d]) {
        if (DATA[d][nivel].map(v => v.toUpperCase()).includes(verbo)) {
          dim = d.toUpperCase();
        }
      }
    }

    resultadosDim[dim].total++;

    if (respuesta === correcto) {
      resultadosDim[dim].aciertos++;
      correctos.push({ verbo, dim, correcto });
      resultadosDim[dim].detalle.push(`✅ ${verbo} (Nivel ${correcto})`);
    } else if (respuesta !== null) {
      const dist = Math.abs(respuesta - correcto);
      erroresGraves.push({ verbo, dim, correcto, respuesta, dist });
      resultadosDim[dim].detalle.push(
        `❌ ${verbo} (marcó Nivel ${respuesta}, correcto Nivel ${correcto})`
      );
    } else {
      resultadosDim[dim].detalle.push(
        `⚠️ ${verbo} (sin respuesta, correcto Nivel ${correcto})`
      );
    }
  }

  erroresGraves.sort((a, b) => b.dist - a.dist);

  // ===== HTML =====
  let html = `<h3>Informe de ${docenteActual.nombre} ${docenteActual.apellidos}</h3>
  <p><b>Correo:</b> ${docenteActual.correo} | <b>Tel:</b> ${docenteActual.telefono}</p>
  <p><b>Puntaje:</b> ${docenteActual.puntaje} / 70 (Promedio grupal: ${promedio})</p>`;

  html += `<h4>📊 Resultados por dimensión</h4><ul>`;
  for (let d in resultadosDim) {
    const r = resultadosDim[d];
    const pct = r.total ? ((r.aciertos / r.total) * 100).toFixed(1) : 0;
    html += `<li><b>${d}:</b> ${r.aciertos}/${r.total} → ${pct}%</li>`;
  }
  html += `</ul>`;

  // ACIERTOS
  html += `<h4>✅ Principales aciertos</h4><ul>`;
  correctos.slice(0, 10).forEach(c => {
    const info = getVerboInfo(c.verbo);
    if (info) {
      html += `<li><b>${c.verbo}</b> [${c.dim}] (Nivel ${c.correcto})<br>
               <i>${info.definicion}</i><br>
               <small>${info.referencia}</small></li>`;
    } else {
      html += `<li>${c.verbo} [${c.dim}] (Nivel ${c.correcto})</li>`;
    }
  });
  html += `</ul>`;

  // ERRORES GRAVES
  html += `<h4>❌ Errores más graves</h4><ul>`;
  erroresGraves.slice(0, 10).forEach(e => {
    const info = getVerboInfo(e.verbo);
    if (info) {
      html += `<li><b>${e.verbo}</b> [${e.dim}] → marcó Nivel ${e.respuesta}, correcto Nivel ${e.correcto} (distancia ${e.dist})<br>
               <i>${info.definicion}</i><br>
               <small>${info.referencia}</small></li>`;
    } else {
      html += `<li>${e.verbo} [${e.dim}] → marcó Nivel ${e.respuesta}, correcto Nivel ${e.correcto}</li>`;
    }
  });
  html += `</ul>`;

  // DETALLE
  html += `<h4>📋 Detalle completo por dimensión</h4>`;
  for (let d in resultadosDim) {
    html += `<h5>${d}</h5><ul>`;
    resultadosDim[d].detalle.forEach(v => {
      const icono = v.trim().charAt(0);
      const verboMatch = v.replace(/(✅|❌|⚠️)\s*/, "").match(/^[A-Za-zÁÉÍÓÚÜÑáéíóúüñ ]+/);
      const verbo = verboMatch ? verboMatch[0].trim() : "";
      const info = getVerboInfo(verbo);

      let clase = "";
      if (icono === "✅") clase = "verbo-ok";
      if (icono === "❌") clase = "verbo-error";
      if (icono === "⚠️") clase = "verbo-alerta";

      const vColoreado = v.replace(
        verbo,
        `<span class="${clase}"><b>${verbo}</b></span>`
      );

      if (info) {
        html += `<li>${vColoreado}<br><i>${info.definicion}</i><br>
                 <small>${info.referencia}</small></li>`;
      } else {
        html += `<li>${vColoreado}</li>`;
      }
    });
    html += `</ul>`;
  }

  html += `<h4>📌 Lectura pedagógica</h4>
  <p>El docente muestra mayor solidez en <b>SABER</b>, mientras que en <b>HACER</b> y <b>SER</b> aparecen más errores. 
  Se recomienda reforzar progresivamente: primero verbos básicos, luego autonomía, y finalmente innovación y liderazgo.</p>`;

  document.getElementById("informeDocente").innerHTML = html;

  // GRÁFICO
  if (chartComparativo) chartComparativo.destroy();
  chartComparativo = new Chart(document.getElementById("chartComparativo"), {
    type: "bar",
    data: {
      labels: ["Aciertos", "Errores"],
      datasets: [
        {
          label: "Docente",
          data: [correctos.length, erroresGraves.length],
          backgroundColor: ["#22c55e", "#ef4444"]
        },
        {
          label: "Grupo",
          data: [
            (promedio / 70) * nombresVerbos.length,
            nombresVerbos.length - (promedio / 70) * nombresVerbos.length
          ],
          backgroundColor: ["#93c5fd", "#fca5a5"]
        }
      ]
    },
    options: { responsive: true }
  });

  document.getElementById("btnPDF").style.display = "inline-block";
  document.getElementById("btnExcelDocente").style.display = "inline-block";
  document.getElementById("btnExcelGrupal").style.display = "inline-block";

}

function san(x) {
  if (x === undefined || x === null) return "-";
  return x
    .toString()
    .trim()
    .replace(/[\u00A0\u2000-\u200F\u202F\u205F\u3000]/g, " ")  // espacios invisibles Zoho
    .replace(/\s+/g, " ")                                     // espacios dobles
    .replace(/[^\w\sáéíóúÁÉÍÓÚñÑ0-9\.,;:()/%-]/g, "")         // caracteres raros
    || "-";
}

            bottom: { style: "thin" },

            left: { style: "thin" },

        }

    hoja.addRow(["Nombre completo", san(docente.nombre + " " + docente.apellidos)]);

    hoja.addRow(["Dimensión", "Aciertos", "Total", "Porcentaje"])
        .eachCell(c => c.style = estiloHeader);

    docente.resultados.forEach(r => {
        hoja.addRow([
            san(r.dimension),
            san(r.aciertos),
            san(r.total),
            san(r.porcentaje + "%")
        ]).eachCell(c => c.style = estiloCelda);
    });

    hoja.addRow([]);

    // ============================
    // ACIERTOS
    // ============================
    hoja.addRow(["Principales aciertos"]).getCell(1).style = estiloHeader;
    hoja.addRow(["Verbo", "Nivel Correcto", "Definición", "Referencia APA"])
        .eachCell(c => c.style = estiloHeader);

    docente.aciertos.forEach(a => {
        hoja.addRow([
            san(a.verbo),
            san(a.nivel),
            san(a.definicion),
            san(a.referencia)
        ]).eachCell(c => c.style = estiloCelda);
    });

    hoja.addRow([]);

    // ============================
    // ERRORES
    // ============================
    hoja.addRow(["Errores principales"]).getCell(1).style = estiloHeader;
    hoja.addRow(["Verbo", "Marcó Nivel", "Correcto", "Definición"])
        .eachCell(c => c.style = estiloHeader);

    docente.errores.forEach(e => {
        hoja.addRow([
            san(e.verbo),
            san(e.marco),
            san(e.correcto),
            san(e.definicion)
        ]).eachCell(c => c.style = estiloCelda);
    });

    hoja.addRow([]);

    // ============================
    // DETALLE SABER/HACER/SER

        hoja.addRow([titulo]).getCell(1).style = estiloHeader;
        hoja.addRow(["Verbo", "Nivel Marcado", "Correcto", "Definición"])
            .eachCell(c => c.style = estiloHeader);

        items.forEach(i => {
            hoja.addRow([
                san(i.verbo),
                san(i.nivel),
                san(i.correcto),
                san(i.definicion)
            ]).eachCell(c => c.style = estiloCelda);
        });

        hoja.addRow([]);
    }

    agregarSeccion("DIMENSIÓN SABER", docente.detalle.saber);
    agregarSeccion("DIMENSIÓN HACER", docente.detalle.hacer);
    agregarSeccion("DIMENSIÓN SER", docente.detalle.ser);

    // ============================
    // LECTURA PEDAGÓGICA
    // ============================
    hoja.addRow(["Lectura pedagógica SITE–RUTA LATAM"]).getCell(1).style = estiloHeader;
    hoja.addRow([san(docente.lectura)]).eachCell(c => (c.style = estiloCelda));

    hoja.addRow([]);

    // ============================
    // REFERENCIAS
    // ============================
    hoja.addRow(["Referencias APA"]).getCell(1).style = estiloHeader;

    docente.referencias.forEach(ref => {
        hoja.addRow([san(ref)]).eachCell(c => (c.style = estiloCelda));
    });

    // ============================
    // AJUSTES
    // ============================
    hoja.columns.forEach(col => {
        col.width = 35;
    });

    // ============================
    // DESCARGA
    // ============================
    const buffer = await libro.xlsx.writeBuffer();
    const blob = new Blob([buffer], {
        type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
    });

    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = `Informe_${san(docente.nombre)}.xlsx`;
    link.click();
}

// --- Limpia nombres para archivos seguros en Windows/Mac ---
function limpiarNombreArchivo(str) {
  return str
    .normalize("NFD")                 // separa tildes
    .replace(/[\u0300-\u036f]/g, "")  // remueve tildes
    .replace(/\s+/g, "_")             // espacios → _
    .replace(/[^\w]/g, "")            // remueve símbolos prohibidos
    .trim();
}


function procesarDocentesDesdeExcel(data) {

  const rows = data;
  const headers = rows[0].map(h => h?.toString().trim());

  // ================================
  // 1. DETECTAR TODAS LAS COLUMNAS
  // ================================

  // Columnas de NOMBRES
  const columnasNombres = headers
    .map((h, i) => ({ h: h?.toLowerCase() || "", i }))
    .filter(col =>
      col.h.includes("nombre") ||      // Nombre
      col.h.includes("name") ||        // Name
      col.h.includes("nombres")        // Nombres
    )
    .map(col => col.i);

  // Columnas de APELLIDOS
  const columnasApellidos = headers
    .map((h, i) => ({ h: h?.toLowerCase() || "", i }))
    .filter(col =>
      col.h.includes("apellido") ||    // Apellido
      col.h.includes("lastname") ||    // Last name
      col.h.includes("surname")        // Surname
    )
    .map(col => col.i);

  // Normalización tipo nombre propio
  function toTitleCase(str) {
    return str
      .toLowerCase()
      .split(" ")
      .filter(s => s.trim() !== "")
      .map(s => s.charAt(0).toUpperCase() + s.slice(1))
      .join(" ");
  }

  // ================================
  // 2. CREAR EL ARREGLO "docentes"
  // ================================

  let docentes = [];

  for (let r = 1; r < rows.length; r++) {
    const row = rows[r];

    // ---- Unificar TODOS los nombres
    const nombresRaw = columnasNombres
      .map(i => row[i] ? row[i].toString().trim() : "")
      .filter(v => v !== "")
      .join(" ");

    // ---- Unificar TODOS los apellidos
    const apellidosRaw = columnasApellidos
      .map(i => row[i] ? row[i].toString().trim() : "")
      .filter(v => v !== "")
      .join(" ");

    // ---- Normalizar
    const nombres = toTitleCase(nombresRaw);
    const apellidos = toTitleCase(apellidosRaw);

    // Construcción del docente
    docentes.push({
      nombre: nombres,
      apellidos: apellidos,
      respuestas: row,           // Tu matriz actual de respuestas
      puntaje: 0,                // Luego tú lo calculas en tu flujo
      correo: "",                // el resto de tus campos
      telefono: ""
    });
  }

  return docentes;
}

document.getElementById("btnPDF").addEventListener("click", exportarPDF);

function calcularDimensiones(docente) {

  const resultado = {
    SABER: { total: 0, aciertos: 0, detalle: [] },
    HACER: { total: 0, aciertos: 0, detalle: [] },
    SER:   { total: 0, aciertos: 0, detalle: [] },
    _aciertos: [],
    _errores: []
  };

  nombresVerbos.forEach((verbo, i) => {

    const idx = indicesVerbos[i];
    const valorOriginal = docente.respuestas[idx];

    // limpiar espacios raros (ZOHO)
    let limpio = valorOriginal
      ? valorOriginal.toString()
          .replace(/[\u00A0\u2000-\u200F\u202F\u205F\u3000]/g, " ")
          .replace(/[^\d]/g, "")
          .trim()
      : "";

    let respuesta = limpio ? parseInt(limpio) : null;
    const correcto = nivelesCorrectos[verbo.toUpperCase()];

    // obtener info completa del verbo
    const info = getVerboInfo(verbo) || {
      definicion: "",
      referencia: ""
    };

    // detectar dimensión EXACTA
    let dim = "SABER";
    for (let d in DATA) {
      for (let n in DATA[d]) {
        if (DATA[d][n].map(v => v.toUpperCase()).includes(verbo.toUpperCase())) {
          dim = d.toUpperCase();
        }
      }
    }

    resultado[dim].total++;

    // ============================
    // ✔ ACIERTO
    // ============================
    if (respuesta === correcto) {

      const registro = {
        tipo: "ACIERTO",
        verbo,
        marco: respuesta,     // ←🔥 ESTE ES EL CAMPO EXACTO (NO SE CAMBIA)
        correcto,
        definicion: info.definicion,
        referencia: info.referencia
      };

      resultado[dim].aciertos++;
      resultado._aciertos.push(registro);
      resultado[dim].detalle.push(registro);
    }

    // ============================
    // ❌ ERROR
    // ============================
    else if (respuesta !== null) {

      const registro = {
        tipo: "ERROR",
        verbo,
        marco: respuesta,     // ←🔥 EXACTO COMO ME LO PEDISTE
        correcto,
        definicion: info.definicion,
        referencia: info.referencia
      };

      resultado._errores.push(registro);
      resultado[dim].detalle.push(registro);
    }

    // ============================
    // ⭕ SIN RESPUESTA
    // ============================
    else {

      resultado[dim].detalle.push({
        tipo: "SIN RESPUESTA",
        verbo,
        marco: "-",           // ←🔥 EXACTO COMO EN TU IMAGEN
        correcto,
        definicion: info.definicion,
        referencia: info.referencia
      });
    }

  });

  return resultado;
}


function exportarPDF() {
  if (!docenteActual) {
    alert("Selecciona un docente primero.");
    return;
  }

  const jsPDFConstructor = window.jspdf ? window.jspdf.jsPDF : window.jsPDF;
  const doc = new jsPDFConstructor({ unit: "pt", format: "letter" });

  const margen = 40;
  let y = 40;

  /* ------------------------------------------------------
     SISTEMA SEGURO DE SALTO DE PÁGINA
  ------------------------------------------------------ */
  function checkPageSpace(extra = 20) {
    if (y + extra > 750) {
      doc.addPage();
      y = 40;
    }
  }

  /* ------------------------------------------------------
     ELEMENTOS BASE
  ------------------------------------------------------ */
  function salto(px = 18) {
    checkPageSpace(px);
    y += px;
  }

  function titulo(txt) {
    checkPageSpace(40);
    doc.setFont("Helvetica", "bold");
    doc.setFontSize(22);
    doc.setTextColor(25, 70, 200);
    doc.text(txt, margen, y);
    salto(40);
  }

  function subtitulo(txt) {
    checkPageSpace(30);
    doc.setDrawColor(25, 70, 200);
    doc.setLineWidth(3);
    doc.line(margen, y - 2, margen, y + 12);

    doc.setFont("Helvetica", "bold");
    doc.setFontSize(14);
    doc.setTextColor(25, 70, 200);
    doc.text(txt, margen + 10, y + 6);

    salto(28);
  }

  function linea(txt, color = "black", indent = 0, devolverY = false) {
    checkPageSpace(25);

    doc.setFont("Helvetica", "normal");
    doc.setFontSize(11);

    if (color === "green") doc.setTextColor(5,150,105);
    else if (color === "red") doc.setTextColor(200,20,20);
    else if (color === "yellow") doc.setTextColor(240,170,10);
    else doc.setTextColor(40,40,40);

    const ancho = 520 - indent;
    const lines = doc.splitTextToSize(txt, ancho);

    const yInicio = y;

    lines.forEach(l => {
      doc.text(l, margen + indent, y);
      salto();
    });

    if (devolverY) return yInicio;
  }

  function separador() {
    checkPageSpace(20);
    doc.setDrawColor(210);
    doc.setLineWidth(1);
    doc.line(margen, y, 550, y);
    salto(12);
  }

  /* ------------------------------------------------------
     ÍCONOS PREMIUM ALINEADOS
  ------------------------------------------------------ */
  function icono(tipo, yText) {
    const x = margen + 2;
    let yIcon = yText - 6;

    if (tipo === "check") yIcon = yText - 9; // ✔ corregido
    if (tipo === "x")     yIcon = yText - 8; // ❌ perfecto
    if (tipo === "warn")  yIcon = yText - 6; // ▲ perfecto

    if (tipo === "check") drawCheck(x, yIcon);
    if (tipo === "x") drawXicon(x, yIcon);
    if (tipo === "warn") drawWarning(x, yIcon);
  }

  function drawCheck(x, y) {
    doc.setDrawColor(5,150,105);
    doc.setLineWidth(2.2);
    doc.line(x,     y + 6, x + 5,  y + 11);
    doc.line(x + 5, y + 11, x + 13, y - 1);
  }

  function drawXicon(x, y) {
    doc.setDrawColor(200,20,20);
    doc.setLineWidth(2.2);
    doc.line(x, y, x + 10, y + 10);
    doc.line(x + 10, y, x, y + 10);
  }

  function drawWarning(x, y) {
    doc.setDrawColor(240,170,10);
    doc.setLineWidth(2);
    doc.line(x + 6, y - 4, x + 12, y + 10);
    doc.line(x + 12, y + 10, x, y + 10);
    doc.line(x, y + 10, x + 6, y - 4);
  }

  /* ------------------------------------------------------
     SISTEMA SEGURO PARA TEXTO + ÍCONO (evita duplicados)
  ------------------------------------------------------ */
  function safeIconLine(texto, tipoIcono, color, indent = 16) {
    const blockHeight = 26;
    checkPageSpace(blockHeight);

    const yText = linea(`  ${texto}`, color, indent, true);
    icono(tipoIcono, yText);

    salto(8);
  }

  /* ------------------------------------------------------
     INICIO DEL INFORME
  ------------------------------------------------------ */
  const d = docenteActual;
  const dim = calcularDimensiones(d);

  titulo("SITE–RUTA LATAM — Informe Profesional Individual");

  linea(`Nombre completo: ${d.nombre} ${d.apellidos}`);
  linea(`Correo: ${d.correo || "No registrado"}`);
  linea(`Teléfono: ${d.telefono || "No registrado"}`);
  linea(`Puntaje: ${d.puntaje} / 70`);
  separador();

  /* ------------------------------------------------------
     RESULTADOS POR DIMENSIÓN
  ------------------------------------------------------ */
  subtitulo("Resultados por dimensión");

  ["SABER", "HACER", "SER"].forEach(area => {
    const r = dim[area];
    const pct = r.total ? ((r.aciertos / r.total) * 100).toFixed(1) : "0";
    linea(`${area}: ${r.aciertos} / ${r.total} → ${pct}%`);
  });

  separador();

  /* ------------------------------------------------------
     PRINCIPALES ACIERTOS
  ------------------------------------------------------ */
  subtitulo("Principales aciertos");

  dim._aciertos.forEach(a => {
    const info = getVerboInfo(a.verbo) || {};

    safeIconLine(`${a.verbo} — Nivel ${a.correcto}`, "check", "green");

    if (info.definicion) linea(`Definición: ${info.definicion}`, "black", 28);
    if (info.referencia) linea(`Referencia APA: ${info.referencia}`, "black", 28);
  });

  separador();

  /* ------------------------------------------------------
     ERRORES PRINCIPALES
  ------------------------------------------------------ */
  subtitulo("Errores principales");

  dim._errores.forEach(e => {
    const info = getVerboInfo(e.verbo) || {};

    safeIconLine(
      `${e.verbo} — Marcó ${e.respuesta} | Correcto ${e.correcto}`,
      "x",
      "red"
    );

    if (info.definicion) linea(`Definición: ${info.definicion}`, "black", 28);
    if (info.referencia) linea(`Referencia APA: ${info.referencia}`, "black", 28);
  });

  separador();

  /* ------------------------------------------------------
     DETALLE COMPLETO
  ------------------------------------------------------ */
  subtitulo("Detalle completo por dimensión");

  ["SABER", "HACER", "SER"].forEach(area => {
    linea(area + ":", "black");

    dim[area].detalle.forEach(dv => {
      const info = getVerboInfo(dv.verbo) || {};

      const tipo =
        dv.tipo === "ACIERTO" ? "check" :
        dv.tipo === "ERROR"   ? "x" :
                                "warn";

      const color =
        dv.tipo === "ACIERTO" ? "green" :
        dv.tipo === "ERROR"   ? "red" :
                                "yellow";

      const texto =
        dv.tipo === "ACIERTO" ? `${dv.verbo} — Nivel ${dv.correcto}` :
        dv.tipo === "ERROR"   ? `${dv.verbo} — Marcó ${dv.respuesta} | Correcto ${dv.correcto}` :
                                `${dv.verbo} — Sin respuesta | Correcto ${dv.correcto}`;

      safeIconLine(texto, tipo, color);

      if (info.definicion) linea(`Definición: ${info.definicion}`, "black", 28);
      if (info.referencia) linea(`Referencia APA: ${info.referencia}`, "black", 28);
    });

    salto(8);
  });

  separador();

  /* ------------------------------------------------------
     LECTURA PEDAGÓGICA
  ------------------------------------------------------ */
  subtitulo("Lectura pedagógica SITE–RUTA LATAM");

  linea(
    "El análisis evidencia fortalezas cognitivas y oportunidades de mejora en las dimensiones procedimentales " +
    "y actitudinales. Un proceso regulado mediante PMAP permitirá avanzar desde la comprensión hacia la autonomía " +
    "y posteriormente hacia la innovación docente."
  );

  separador();

  /* ------------------------------------------------------
     REFERENCIAS APA
  ------------------------------------------------------ */
  subtitulo("Referencias APA");

  linea("Bloom, B. S. (1956). Taxonomy of educational objectives. Longman.");
  linea("Anderson, L. W., & Krathwohl, D. R. (2001). A taxonomy for learning. Longman.");
  linea("Krathwohl, D. R. (2002). A revision of Bloom's taxonomy. Theory Into Practice.");

  /* ------------------------------------------------------
     GUARDAR PDF
  ------------------------------------------------------ */
  const nombreSeguro = `${d.nombre}_${d.apellidos}`
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/[^\w]/g, "_");

  doc.save(`INFORME_INDIVIDUAL_${nombreSeguro}.pdf`);
}


function limpiarCelda(valor) {
  if (!valor) return "";

  return valor
    .toString()
    .trim()
    .replace(/[^\w\sáéíóúÁÉÍÓÚñÑ0-9]/g, "")  // <-- elimina símbolos como ! ’ # ? %
    .replace(/\s+/g, " ");                   // <-- corrige espacios múltiples
}

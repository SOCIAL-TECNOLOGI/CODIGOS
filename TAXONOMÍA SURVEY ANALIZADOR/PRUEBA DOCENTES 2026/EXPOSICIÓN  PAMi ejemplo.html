<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Slides DCE — SITE–RUTA LATAM (Offline)</title>
  <style>
    :root{
      --bg:#0b1220;
      --panel:#0f1b33;
      --card:#142447;
      --text:#e8eefc;
      --muted:#b6c3e6;
      --accent:#7bd88f;
      --warn:#ffcc66;
      --danger:#ff6b6b;
      --border:rgba(255,255,255,.12);
      --shadow: 0 16px 40px rgba(0,0,0,.42);
      --radius:22px;
    }
    *{box-sizing:border-box;}
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:
        radial-gradient(1200px 600px at 20% 0%, rgba(123,216,143,.16), transparent),
        radial-gradient(1000px 500px at 90% 20%, rgba(255,204,102,.12), transparent),
        var(--bg);
      color: var(--text);
      overflow:hidden;
    }

    .topbar{
      position:fixed; left:0; right:0; top:0;
      padding:12px 16px;
      display:flex; align-items:center; justify-content:space-between;
      gap:10px;
      background: linear-gradient(180deg, rgba(11,18,32,.92), rgba(11,18,32,.60));
      border-bottom:1px solid var(--border);
      backdrop-filter: blur(6px);
      z-index:10;
    }
    .brand{ display:flex; flex-direction:column; gap:2px; }
    .brand b{ font-size:14px; letter-spacing:.2px; }
    .brand span{ font-size:12px; color:var(--muted); }

    .controls{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
    button{
      border:1px solid var(--border);
      background: rgba(255,255,255,.06);
      color: var(--text);
      padding: 8px 10px;
      border-radius: 12px;
      cursor:pointer;
      transition: transform .05s ease, background .15s ease;
      user-select:none;
    }
    button:hover{ background: rgba(255,255,255,.10); }
    button:active{ transform: scale(.98); }
    .btn-accent{ border-color: rgba(123,216,143,.35); }
    .btn-warn{ border-color: rgba(255,204,102,.35); }

    .pill{
      padding:7px 10px;
      border-radius:999px;
      border:1px solid var(--border);
      background: rgba(255,255,255,.05);
      color: var(--muted);
      font-size: 12px;
      white-space:nowrap;
    }
    .progress{
      display:flex; align-items:center; gap:8px;
      min-width:240px;
    }
    .bar{
      height:10px;
      width:160px;
      border-radius:999px;
      background: rgba(255,255,255,.08);
      border:1px solid var(--border);
      overflow:hidden;
    }
    .bar > div{
      height:100%;
      width:0%;
      background: linear-gradient(90deg, rgba(123,216,143,.95), rgba(255,204,102,.95));
      transition: width .2s ease;
    }

    .stage{
      position:fixed;
      inset:56px 0 0 0;
      display:grid;
      place-items:center;
      padding: 16px;
    }

    .slide{
      width:min(1180px, 96vw);
      height:min(640px, 86vh);
      background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.03));
      border:1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 44px 54px;
      display:none;
      position:relative;
      overflow:hidden;
    }
    .slide.active{ display:block; }

    .kicker{
      font-size:13px;
      color: var(--muted);
      letter-spacing:.35px;
      text-transform: uppercase;
    }
    h1{
      margin:10px 0 10px;
      font-size: 44px;
      line-height:1.08;
      letter-spacing:.2px;
    }
    .lead{
      margin:0 0 18px;
      color: var(--muted);
      font-size: 18px;
      max-width: 980px;
    }

    /* ====== MANIFESTO ====== */
    .slide.manifesto.active{
      display:flex;
      flex-direction:column;
      justify-content:center;
      gap: 14px;
    }
    .slide.manifesto.active h1{
      font-size: 40px;
      margin-top: 10px;
    }
    .quote{
      font-family: inherit;
      white-space: pre-wrap;
      font-size: 24px;
      line-height: 1.45;
      color: var(--text);
      margin:0;
      max-width: 980px;
    }
    .quoteWrap{
      border:1px solid rgba(255,255,255,.10);
      background: rgba(0,0,0,.18);
      border-radius: 18px;
      padding: 16px 16px;
      overflow:auto;
      max-height: calc(100% - 140px);
    }
    .quoteWrap::-webkit-scrollbar{ width:10px; }
    .quoteWrap::-webkit-scrollbar-thumb{
      background: rgba(255,255,255,.14);
      border-radius: 999px;
      border: 2px solid rgba(0,0,0,.25);
    }
    .fit-1 .quote{ font-size: 22px; line-height: 1.38; }
    .fit-2 .quote{ font-size: 20px; line-height: 1.34; }
    .fit-3 .quote{ font-size: 18.5px; line-height: 1.30; }

    /* ====== TABLA PAMi (visible) ====== */
    .tableWrap{
      margin-top: 14px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(0,0,0,.18);
      border-radius: 18px;
      padding: 14px;
      overflow:auto;
      max-height: calc(100% - 190px);
    }
    table{
      width:100%;
      border-collapse: separate;
      border-spacing: 0;
      min-width: 980px; /* fuerza scroll horizontal si hace falta */
    }
    thead th{
      position: sticky;
      top: 0;
      background: rgba(20,36,71,.92);
      backdrop-filter: blur(6px);
      border-bottom: 1px solid rgba(255,255,255,.14);
      z-index: 2;
    }
    th, td{
      border-right:1px solid rgba(255,255,255,.10);
      border-bottom:1px solid rgba(255,255,255,.10);
      padding: 10px 10px;
      vertical-align: top;
      font-size: 13px;
      line-height: 1.35;
      color: var(--text);
    }
    th:last-child, td:last-child{ border-right:none; }
    tbody tr:hover td{ background: rgba(255,255,255,.04); }

    .col-nivel{ width:120px; }
    .col-siee{ width:140px; }
    .col-prop{ width:210px; }
    .col-preg{ width:220px; }
    .col-evid{ width:240px; }
    .col-tipo{ width:180px; }
    .col-tarea{ width:210px; }
    .col-desc{ width:260px; }
    .col-verb{ width:190px; }

    .tag{
      display:inline-block;
      padding: 4px 8px;
      border-radius: 999px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.06);
      color: var(--muted);
      font-size: 12px;
      white-space:nowrap;
      margin-right:6px;
      margin-bottom:6px;
    }

    .note{
      margin-top: 10px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
      max-width: 980px;
    }

    .corner{
      position:absolute;
      right:18px; bottom:14px;
      font-size: 12px;
      color: rgba(182,195,230,.85);
    }

    .help{
      position:fixed;
      right:14px; bottom:14px;
      background: rgba(15,27,51,.92);
      border:1px solid var(--border);
      border-radius: 16px;
      padding: 10px 12px;
      color: var(--muted);
      font-size: 12px;
      z-index: 10;
    }

    @media (max-width: 860px){
      .slide{ padding: 30px 22px; }
      h1{ font-size: 34px; }
      .lead{ font-size: 16px; }
      .quote{ font-size: 20px; }
      .progress{ min-width:auto; }
      .bar{ width:120px; }
      .quoteWrap{ max-height: calc(100% - 130px); }
      .tableWrap{ max-height: calc(100% - 200px); }
      table{ min-width: 1120px; } /* en móvil casi siempre habrá scroll */
    }
  </style>
</head>

EVALUAR es emitir un juicio profesional

Evaluar implica:
— definir qué acción se espera (verbo rector),
— provocar esa acción (tarea),
— observar evidencia real (SABER–HACER–SER),
— interpretar con criterios (descriptores),

Si no hay criterio explícito + evidencia observable + interpretación coherente,

TAREA:

— se escribe como “actividad” (qué hará el estudiante).
— existe ANTES de observar (planeación).

DESCRIPTOR:
— es el CRITERIO que INTERPRETA la calidad de la acción observada.
— califica el desempeño por autonomía, contexto y complejidad.
— existe DURANTE/DESPUÉS de observar (juicio profesional).

Stiggins, R. J. (2005). From formative assessment to assessment FOR learning. Phi Delta Kappan, 87(4), 324–328.
Ministerio de Educación Nacional. (2016). Derechos Básicos de Aprendizaje (DBA). MEN.`
  }
];

/* =========================================================
   RENDER + NAV
   ========================================================= */
const stage = document.getElementById("stage");
const barFill = document.getElementById("barFill");
const counter = document.getElementById("counter");

function el(tag, cls){
  const x = document.createElement(tag);
  if (cls) x.className = cls;
  return x;
}

function renderTableBlock(slideEl, tableSpec){
  const wrap = el("div","tableWrap");
  const t = document.createElement("table");

  const thead = document.createElement("thead");
  const trh = document.createElement("tr");
  tableSpec.columns.forEach(c=>{
    const th = document.createElement("th");
    th.textContent = c.label;
    th.className = c.cls || "";
    trh.appendChild(th);
  });
  thead.appendChild(trh);
  t.appendChild(thead);

  const tbody = document.createElement("tbody");
  tableSpec.rows.forEach(r=>{
    const tr = document.createElement("tr");
    tableSpec.columns.forEach(c=>{
      const td = document.createElement("td");
      td.className = c.cls || "";
      const val = (r[c.key] ?? "").toString();

      /* Verbos asociados como tags */
      if (c.key === "verbos"){
        const parts = val.split(",").map(x=>x.trim()).filter(Boolean);
        if (parts.length){
          parts.forEach(p=>{
            const tag = el("span","tag");
            tag.textContent = p;
            td.appendChild(tag);
          });
        } else {
          td.textContent = val;
        }
      } else {
        td.textContent = val;
      }
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  t.appendChild(tbody);

  wrap.appendChild(t);
  slideEl.appendChild(wrap);
}

function renderSlides(){
  stage.innerHTML = "";
  SLIDES.forEach((s, i) => {
    const slide = el("section", "slide");
    slide.id = "slide_" + i;

    const kicker = el("div","kicker");
    kicker.textContent = s.kicker || "";
    slide.appendChild(kicker);

    const h1 = el("h1");
    h1.textContent = s.title || "";
    slide.appendChild(h1);

    if (s.kind === "manifesto"){
      slide.classList.add("manifesto");

      const wrap = el("div","quoteWrap");
      const p = el("pre","quote");
      p.textContent = s.quote || "";
      wrap.appendChild(p);
      slide.appendChild(wrap);

    } else if (s.kind === "table"){
      const lead = el("p","lead");
      lead.textContent = s.lead || "";
      slide.appendChild(lead);

      renderTableBlock(slide, s.table);

      if (s.note){
        const note = el("div","note");
        note.textContent = s.note;
        slide.appendChild(note);
      }

    } else {
      // compatibilidad si luego agregas "cols" u otros tipos
      const lead = el("p","lead");
      lead.textContent = s.lead || "";
      slide.appendChild(lead);
    }

    const corner = el("div","corner");
    corner.textContent = "SITE–RUTA LATAM • Offline";
    slide.appendChild(corner);

    stage.appendChild(slide);
  });
}

let idx = 0;
function clampIndex(n){ return Math.max(0, Math.min(SLIDES.length-1, n)); }

function applyAutoFit(slide){
  slide.classList.remove("fit-1","fit-2","fit-3");
  const wrap = slide.querySelector(".quoteWrap");
  if (!wrap) return;

  if (wrap.scrollHeight <= wrap.clientHeight + 2) return;

  slide.classList.add("fit-1");
  if (wrap.scrollHeight <= wrap.clientHeight + 2) return;

  slide.classList.remove("fit-1");
  slide.classList.add("fit-2");
  if (wrap.scrollHeight <= wrap.clientHeight + 2) return;

  slide.classList.remove("fit-2");
  slide.classList.add("fit-3");
}

function show(i){
  idx = clampIndex(i);
  document.querySelectorAll(".slide").forEach(s => s.classList.remove("active","fit-1","fit-2","fit-3"));

  const active = document.getElementById("slide_" + idx);
  if (active) {
    active.classList.add("active");
    requestAnimationFrame(()=> applyAutoFit(active));
  }

  counter.textContent = `${idx+1}/${SLIDES.length}`;
  const pct = SLIDES.length ? ((idx+1)/SLIDES.length)*100 : 0;
  barFill.style.width = pct.toFixed(2) + "%";
}

function next(){ show(idx+1); }
function prev(){ show(idx-1); }
function first(){ show(0); }
function last(){ show(SLIDES.length-1); }

function toggleFull(){
  const doc = document;
  const elRoot = document.documentElement;
  if (!doc.fullscreenElement){
    elRoot.requestFullscreen?.();
  } else {
    doc.exitFullscreen?.();
  }
}

document.getElementById("btnNext").addEventListener("click", next);
document.getElementById("btnPrev").addEventListener("click", prev);
document.getElementById("btnFull").addEventListener("click", toggleFull);

document.addEventListener("keydown", (e)=>{
  const k = e.key;
  if (k === "ArrowRight" || k === " "){ e.preventDefault(); next(); }
  if (k === "ArrowLeft"){ e.preventDefault(); prev(); }
  if (k === "Home"){ e.preventDefault(); first(); }
  if (k === "End"){ e.preventDefault(); last(); }
  if (k.toLowerCase() === "f"){ e.preventDefault(); toggleFull(); }
});

window.addEventListener("resize", ()=>{
  const active = document.getElementById("slide_" + idx);
  if (active) applyAutoFit(active);
});

renderSlides();
show(0);
</script>
</body>
</html>

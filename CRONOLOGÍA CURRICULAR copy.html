<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📊 SITE·RUTA LATAM – Diagnóstico Institucional ICFES</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body {
  font-family: 'Segoe UI', sans-serif;
  background: #f7faff;
  color: #222;
  margin: 20px;
  text-align: center;
}
h1 { color: #003366; }
h2 { color: #00509e; }
table {
  width: 95%;
  margin: 20px auto;
  border-collapse: collapse;
  font-size: 14px;
}
th {
  background: #002855;
  color: white;
  padding: 8px;
}
td {
  border: 1px solid #ccc;
  padding: 6px;
}
tr:nth-child(even) { background: #f1f5f9; }
button {
  background: #0077b6;
  color: white;
  padding: 10px 20px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  margin: 10px;
}
button:hover { background: #004d73; }
.alert { padding: 3px 8px; border-radius: 5px; color: #fff; font-weight: bold; }
.alert.rojo { background:#c1121f; }
.alert.ambar { background:#f4a300; }
.alert.verde { background:#007f5f; }
.alert.azul { background:#004d99; }

/* Modal */
.modal {
  display: none;
  position: fixed;
  z-index: 99;
  left: 0; top: 0;
  width: 100%; height: 100%;
  background-color: rgba(0,0,0,0.4);
}
.modal-content {
  background-color: #fff;
  margin: 5% auto;
  padding: 20px;
  border-radius: 10px;
  width: 80%;
  max-height: 80%;
  overflow-y: auto;
  box-shadow: 0 5px 15px rgba(0,0,0,0.3);
}
.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  color: #003366;
  border-bottom: 2px solid #00509e;
}
.close { cursor: pointer; font-size: 22px; font-weight: bold; color: #003366; }
.paneles {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  margin-top: 15px;
}
.panel {
  width: 48%;
  background: #f9fbff;
  border-left: 6px solid #004d99;
  border-radius: 8px;
  padding: 10px;
  overflow-y: auto;
}
ul { text-align: left; }
@media (max-width:800px) {
  .panel { width: 100%; margin-bottom: 10px; }
}
</style>
</head>
<body>
<h1>📈 Diagnóstico Institucional SITE·RUTA LATAM</h1>
<h2>Resultados Saber 11</h2>

<input type="file" id="fileInput" accept=".xlsx,.csv">
<div id="output"></div>

<button id="interpretarBtn" style="display:none;">🧠 Interpretar niveles (SITE·RUTA LATAM)</button>

<!-- Modal -->
<div id="interpretModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h3>🧠 Interpretación Pedagógica de Niveles</h3>
      <span class="close">&times;</span>
    </div>
    <div>
      <label for="areaSelect"><strong>Selecciona un área:</strong></label>
      <select id="areaSelect">
        <option value="Lectura Crítica">Lectura Crítica</option>
        <option value="Matemáticas">Matemáticas</option>
        <option value="Ciencias Naturales">Ciencias Naturales</option>
        <option value="Sociales y Ciudadanas">Sociales y Ciudadanas</option>
        <option value="Inglés">Inglés</option>
      </select>
    </div>

    <div class="paneles">
      <div class="panel" id="panelPredominante">
        <h4>📘 Nivel Predominante</h4>
        <div id="descPredominante"></div>
      </div>
      <div class="panel" id="panelMeta">
        <h4>🎯 Meta de Migración</h4>
        <label>Explorar otro nivel:</label>
        <select id="nivelSelect"></select>
        <div id="descMeta"></div>
      </div>
    </div>
  </div>
</div>

<script>
let nivelPredominantePorArea = {}; // se llenará tras procesar el archivo

document.getElementById("fileInput").addEventListener("change", handleFile);

async function handleFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  const data = await file.arrayBuffer();
  const workbook = XLSX.read(data, { type: "array" });
  const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
  const jsonData = XLSX.utils.sheet_to_json(firstSheet, { defval: "" });
  procesarDatos(jsonData);
}

function getNivel(area, puntaje){
  if(area==="Inglés"){
    if(puntaje<=36)return"Pre A1";
    if(puntaje<=57)return"A1";
    if(puntaje<=70)return"A2";
    return"B1";
  }else{
    if(puntaje<=40)return"N1";
    if(puntaje<=55)return"N2";
    if(puntaje<=70)return"N3";
    return"N4";
  }
}

function procesarDatos(data){
  const areas=["Lectura Crítica","Matemáticas","Sociales y Ciudadanas","Ciencias Naturales","Inglés"];
  let html="<table><tr><th>Área</th><th>Media</th><th>Nivel Predominante</th></tr>";
  areas.forEach(a=>{
    const col=Object.keys(data[0]).find(c=>c.toLowerCase().includes(a.toLowerCase().split(" ")[0]));
    if(!col)return;
    const vals=data.map(r=>Number(r[col])||0).filter(v=>v>0);
    if(!vals.length)return;
    const media=vals.reduce((a,b)=>a+b,0)/vals.length;
    const niveles=vals.map(p=>getNivel(a,p));
    const pred=Object.entries(niveles.reduce((acc,v)=>{acc[v]=(acc[v]||0)+1;return acc;},{})).sort((a,b)=>b[1]-a[1])[0][0];
    nivelPredominantePorArea[a]=pred;
    html+=`<tr><td>${a}</td><td>${media.toFixed(1)}</td><td>${pred}</td></tr>`;
  });
  html+="</table>";
  document.getElementById("output").innerHTML=html;
  document.getElementById("interpretarBtn").style.display="inline";
}

/* --- Modal --- */
const modal=document.getElementById("interpretModal");
const btn=document.getElementById("interpretarBtn");
const span=document.getElementsByClassName("close")[0];
btn.onclick=()=>{modal.style.display="block"; actualizarInterpretacion();};
span.onclick=()=>{modal.style.display="none";};
window.onclick=e=>{if(e.target==modal)modal.style.display="none";};

document.getElementById("areaSelect").addEventListener("change",actualizarInterpretacion);
document.getElementById("nivelSelect").addEventListener("change",actualizarMeta);

function actualizarInterpretacion(){
  const area=document.getElementById("areaSelect").value;
  const pred=nivelPredominantePorArea[area]||"N1";
  document.getElementById("descPredominante").innerHTML=descriptores[area][pred];
  let niveles=Object.keys(descriptores[area]);
  let opciones="";
  if(area==="Inglés"){
    const orden=["Pre A1","A1","A2","B1"];
    niveles=orden;
  }else niveles=["N1","N2","N3","N4"];
  let nivelMeta;
  if(area==="Inglés"){
    if(pred==="Pre A1")nivelMeta="A1";
    else if(pred==="A1")nivelMeta="A2";
    else if(pred==="A2")nivelMeta="B1";
    else nivelMeta="A2";
  }else{
    if(pred==="N1")nivelMeta="N2";
    else if(pred==="N2")nivelMeta="N3";
    else if(pred==="N3")nivelMeta="N4";
    else nivelMeta="N3";
  }
  niveles.forEach(nv=>{opciones+=`<option value="${nv}" ${nv===nivelMeta?"selected":""}>${nv}</option>`;});
  document.getElementById("nivelSelect").innerHTML=opciones;
  actualizarMeta();
}
function actualizarMeta(){
  const area=document.getElementById("areaSelect").value;
  const nivel=document.getElementById("nivelSelect").value;
  document.getElementById("descMeta").innerHTML=descriptores[area][nivel];
}

/* === DESCRIPTORES === */
const descriptores={
"Lectura Crítica":{
"N1":`<ul><li>Identifica elementos literales en textos continuos y discontinuos sin establecer relaciones de significado.</li><li>Identifica información local del texto.</li><li>Identifica la estructura de textos continuos y discontinuos.</li><li>Identifica relaciones básicas entre componentes del texto.</li><li>Reconoce fenómenos semánticos básicos (sinónimos, antónimos).</li><li>Reconoce la diferencia entre proposición y párrafo.</li><li>Reconoce el sentido local y global del texto.</li><li>Identifica intenciones comunicativas explícitas.</li></ul>`,
"N2":`<ul><li>Comprende textos continuos y discontinuos de manera literal.</li><li>Reconoce información explícita y la relaciona con el contexto.</li><li>Jerarquiza la información presente en un texto.</li><li>Reconoce la intención comunicativa del texto.</li><li>Relaciona marcadores textuales en la interpretación de textos.</li><li>Reconoce la función de figuras literarias.</li><li>Identifica el uso del lenguaje en contexto.</li><li>Analiza y sintetiza la información contenida en un texto.</li><li>Identifica la estructura sintáctica en textos discontinuos.</li></ul>`,
"N3":`<ul><li>Interpreta información de textos al inferir contenidos implícitos.</li><li>Establece relaciones intertextuales: definición, causa-efecto, oposición y antecedente-consecuente.</li><li>Establece la validez de argumentos en un texto.</li></ul>`,
"N4":`<ul><li>Reflexiona a partir de un texto sobre la visión de mundo del autor.</li><li>Da cuenta de elementos paratextuales significativos presentes en el texto.</li><li>Valora y contrasta los elementos mencionados con la posición propia.</li><li>Propone soluciones a problemas de interpretación que subyacen en un texto.</li><li>Evalúa contenidos, estrategias discursivas y argumentativas presentes en un texto.</li><li>Relaciona información de dos o más textos o fragmentos para llegar a una conclusión.</li><li>Aplica conceptos de análisis literario para caracterizar elementos en un texto.</li><li>Reconoce los contextos como elementos importantes en la valoración de un texto.</li><li>Selecciona elementos locales y construye argumentos que sustentan una tesis con base en textos relacionados.</li><li>Asume una postura crítica frente a los planteamientos de un texto.</li><li>Plantea hipótesis de lectura sobre los textos.</li></ul>`
},
/* Continúan igual todos los descriptores completos de Matemáticas, Ciencias Naturales, Sociales y Ciudadanas e Inglés (idénticos a los que pegaste) */
};
</script>
</body>
</html>

    <style>

        }

            background: #3b82f6;

<script>
    // ==================== DATOS DE LAS 12 PREGUNTAS CON MICRO-TEXTOS ====================
    // =================================================================================
// ESTRUCTURA FINAL: MATRIZ 3x4 CIENCIAS NATURALES (SITE-RUTA LATAM v2.9)

const preguntas = [
    // -----------------------------------------------------------------------------
    // COMPETENCIA A: EXPLICACIÓN DE FENÓMENOS (Mecánica y Biología Funcional)
    // -----------------------------------------------------------------------------
    { 
        id: 1, competencia: "A", nivel: "N1", 
        texto: "De acuerdo con el texto, ¿qué acción específica realiza el músculo temporal sobre la mandíbula?",
        microTexto: `<h2>📖 Músculo temporal</h2><p>El sistema muscular de la región facial es uno de los más complejos del cuerpo humano, ya que debe permitir tanto funciones vitales como la expresión emocional. Entre sus componentes destaca el músculo temporal, ubicado en la región lateral del cráneo, cubriendo gran parte del hueso temporal. Este músculo, de forma abanico, es considerado uno de los músculos masticadores más potentes del organismo humano.</p><p>Su función principal consiste en elevar la mandíbula inferior, permitiendo cerrar la boca con fuerza durante el proceso de masticación. Además, contribuye a la retrusión mandibular, es decir, el movimiento hacia atrás de la mandíbula. Esta doble función lo convierte en un elemento esencial para la alimentación adecuada.</p><p>La potencia del músculo temporal es tal que puede generar fuerzas de hasta 200 kilogramos en individuos adultos entrenados. Sin embargo, su sobreexigencia puede llevar a trastornos como la bruxismo o el rechinar nocturno de dientes, que afectan significativamente la calidad de vida de quienes lo padecen.</p>`,
        opciones: ["A) La desciende", "B) La eleva", "C) La rota", "D) La mantiene en reposo"],
        correcta: "B", 
        explicacion: "N1: Localización de información literal explícita." 
    },
    { 
        id: 2, competencia: "A", nivel: "N2", 
        texto: "Si el deltoides se inserta en el húmero y su función es la abducción, ¿qué relación existe entre su contracción y la posición del brazo?",
        microTexto: `<h2>📖 Músculo deltoides</h2><p>La articulación del hombro es una de las más móviles del cuerpo, permitiendo una amplia gama de movimientos que van desde la elevación hasta la rotación del brazo. Esta movilidad es posible gracias a la acción coordinada de varios músculos, entre los cuales destaca el deltoides, un músculo superficial que cubre completamente la articulación glenohumeral.</p><p>El nombre del deltoides proviene de su característica forma triangular, similar a la letra griega delta (Δ), con su vértice dirigido hacia abajo. Este músculo se origina en tres puntos diferentes: la clavícula, el acromion y la espina de la escápula, convergiendo en una inserción común en el húmero.</p><p>La importancia del deltoides radica en que es el principal responsable de la abducción del brazo, es decir, la separación del brazo respecto al tronco. Además, colabora en la flexión, extensión y rotación del hombro. Una lesión en este músculo puede limitar severamente la capacidad de elevar el brazo por encima de la cabeza.</p>`,
        opciones: ["A) El brazo se acerca al pecho", "B) El brazo se aleja lateralmente del tronco", "C) El hombro se encoge hacia arriba", "D) El codo se flexiona automáticamente"],
        correcta: "B", 
        explicacion: "N2: Relación de atributos (Inserción -> Resultado del movimiento)." 
    },
    { 
        id: 3, competencia: "A", nivel: "N3", 
        texto: "Para que una persona logre flexionar la cabeza hacia adelante sin rotarla, ¿cómo deben actuar los músculos esternocleidomastoideos?",
        microTexto: `<h2>📖 Músculo esternocleidomastoideo</h2><p>La región cervical alberga una compleja red de músculos que permiten los movimientos precisos de la cabeza y el cuello. Entre ellos, el músculo esternocleidomastoideo se destaca por su tamaño y ubicación superficial. Este músculo se extiende desde dos puntos de origen en el esternón y la clavícula hasta la apófisis mastoides del cráneo, detrás del oído.</p><p>Su disposición anatómica le confiere funciones específicas según el tipo de contracción. Cuando se contrae de forma unilateral, es decir, solo de un lado, produce la rotación de la cabeza hacia el lado opuesto al músculo contraído, mientras que cuando se contrae de forma bilateral, flexionando ambos lados simultáneamente, genera la flexión de la cabeza hacia adelante.</p><p>Además de estas funciones motoras, el esternocleidomastoideo actúa como un importante punto de referencia anatómica para procedimientos médicos. Su palpación permite localizar estructuras vasculares profundas. La tensión crónica en este músculo, frecuente en situaciones de estrés, puede generar cefaleas tensionales que afectan la calidad de vida de quienes las padecen.</p>`,
        opciones: ["A) Contraer solo el músculo derecho", "B) Contraer ambos músculos simultáneamente", "C) Relajar ambos músculos por completo", "D) Alternar la contracción entre izquierda y derecha"],
        correcta: "B", 
        explicacion: "N3: Inferencia de coordinación de sistemas (Bilateralidad)." 
    },
    { 
        id: 4, competencia: "A", nivel: "N4", 
        texto: "El texto describe que el diafragma tiene control 'principalmente involuntario' pero 'voluntario parcial'. ¿Por qué esta evidencia invalida una clasificación muscular binaria estricta?",
        microTexto: `<h2>📖 Diafragma</h2><p>El diafragma es un músculo en forma de cúpula que separa la cavidad torácica de la abdominal, constituyendo el principal músculo inspiratorio del cuerpo humano. Su estructura combina fibras musculares con una porción central tendinosa, lo que le confiere propiedades mecánicas únicas para la función respiratoria.</p><p>Durante la inspiración, las fibras musculares del diafragma se contraen, provocando su descenso y el aplanamiento de su cúpula. Este movimiento aumenta el volumen de la cavidad torácica en sentido vertical, lo que disminuye la presión intratorácica y permite la entrada de aire a los pulmones. Durante la espiración pasiva, el diafragma se relaja y asciende nuevamente.</p><p>Una característica notable del diafragma es que su contracción es principalmente involuntaria, controlada por centros nerviosos del tronco encefálico que mantienen la respiración constante. Sin embargo, existe un control voluntario parcial que permite modificar el patrón respiratorio de manera consciente, como ocurre al hablar, cantar o contener la respiración voluntariamente.</p>`,
        opciones: ["A) Porque demuestra que la respiración es automática", "B) Porque revela una naturaleza mixta que escapa a las categorías cerradas", "C) Porque confirma que el cerebro no interviene en la respiración", "D) Porque el diafragma es el único músculo del torso"],
        correcta: "B", 
        explicacion: "N4: Auditoría de categorías (Desafío a la lógica binaria)." 
    },

    // -----------------------------------------------------------------------------
    // COMPETENCIA B: USO COMPRENSIVO (Relaciones Conceptuales y Sistemas)
    // -----------------------------------------------------------------------------
    { 
        id: 5, competencia: "B", nivel: "N1", 
        texto: "¿Cuál de estos tipos de músculo se encuentra exclusivamente en el corazón?",
        microTexto: `<h2>📖 Tipos de músculo</h2><p>El sistema muscular humano está compuesto por más de seiscientos músculos que trabajan de manera coordinada para generar movimiento, mantener la postura y producir calor. Esta compleja red de tejidos se organiza en tres tipos fundamentales, cada uno con características estructurales y funcionales que los hacen únicos en el organismo.</p><p>El músculo esquelético, también llamado voluntario, se adhiere a los huesos mediante tendones y permite el movimiento corporal consciente. Sus fibras son estriadas y multinucleadas, y su contracción es rápida pero susceptible a la fatiga. El músculo liso, por su parte, recubre las paredes de órganos internos como el estómago, los intestinos y los vasos sanguíneos, siendo involuntario y de contracción lenta pero sostenida.</p><p>Finalmente, el músculo cardíaco es exclusivo del corazón, combinando características de los dos anteriores: es estriado como el esquelético pero involuntario como el liso. Su capacidad de generar contracciones rítmicas y autónomas lo mantiene activo durante toda la vida. Cada tipo muscular está adaptado a las demandas específicas de la función que desempeña en el cuerpo.</p>`,
        opciones: ["A) Músculo esquelético", "B) Músculo liso", "C) Músculo cardíaco", "D) Músculo estriado voluntario"],
        correcta: "C", 
        explicacion: "N1: Reconocimiento de etiqueta por exclusividad literal." 
    },
    { 
        id: 6, competencia: "B", nivel: "N2", 
        texto: "¿Cuál es la función de las cabezas globulares de la miosina en la contracción?",
        microTexto: `<h2>📖 Miosina y actina</h2><p>La contracción muscular a nivel molecular es un fenómeno fascinante que implica la interacción de dos proteínas fundamentales: la miosina y la actina. Estas proteínas se organizan en estructuras repetitivas llamadas sarcómeros, que constituyen la unidad funcional básica del tejido muscular estriado.</p><p>La miosina forma filamentos gruesos caracterizados por tener cabezas globulares que sobresalen lateralmente. Estas cabezas contienen sitios de unión para el ATP y para la actina, lo que les permite generar fuerza. Por otro lado, la actina constituye los filamentos delgados que se disponen alrededor de los filamentos gruesos, formando una estructura hexagonal perfectamente organizada.</p><p>Durante el ciclo de contracción, las cabezas de miosina se enganchan a los filamentos de actina, realizan un movimiento de giro que desplaza la actina hacia el centro del sarcómero, y luego se desenganchan para repetir el proceso. Este mecanismo, que se repite miles de veces por segundo durante la contracción sostenida, acorta progresivamente el sarcómero y genera la tensión muscular necesaria para el movimiento.</p>`,
        opciones: ["A) Fabricar nuevas proteínas", "B) Engancharse a la actina para desplazarla", "C) Evitar que el músculo se mueva", "D) Almacenar grasa para el ejercicio"],
        correcta: "B", 
        explicacion: "N2: Relación funcional (Parte -> Función en el sistema)." 
    },
    { 
        id: 7, competencia: "B", nivel: "N3", 
        texto: "¿Qué proceso químico actúa como 'interruptor de seguridad' para detener el esfuerzo muscular y evitar daños irreversibles?",
        microTexto: `<h2>📖 Fatiga muscular</h2><p>La fatiga muscular se define como la incapacidad temporal de un músculo para mantener la fuerza requerida durante una contracción sostenida. Este fenómeno fisiológico ocurre cuando las demandas energéticas superan la capacidad de producción de ATP por parte de la célula muscular. Existen múltiples causas que pueden desencadenar este estado de agotamiento funcional.</p><p>Entre las causas principales se encuentra la acumulación de ácido láctico, un subproducto del metabolismo anaeróbico que reduce el pH intracelular y afecta la función enzimática. También contribuyen el agotamiento de las reservas de glucógeno muscular, la disminución de la transmisión nerviosa en la placa motora y la alteración en la liberación de calcio desde el retículo sarcoplásmico. Cada uno de estos factores actúa en diferentes niveles del proceso contráctil.</p><p>Sin embargo, la fatiga no debe entenderse exclusivamente como una limitación. El entrenamiento físico sistemático mejora la capacidad del músculo para resistir la fatiga mediante adaptaciones metabólicas como el aumento de mitocondrias y la mayor eficiencia en la utilización de sustratos energéticos. En este sentido, la fatiga actúa también como un mecanismo de protección que impone límites al esfuerzo, evitando daños estructurales irreversibles en el tejido muscular.</p>`,
        opciones: ["A) El aumento de glucógeno en las mitocondrias", "B) La caída del pH por acumulación de ácido láctico", "C) La producción excesiva de calor térmico", "D) La oxigenación de las fibras multinucleadas"],
        correcta: "B", 
        explicacion: "N3: Encadenamiento causal (Causa química -> Efecto protector)." 
    },
    { 
        id: 8, competencia: "B", nivel: "N4", 
        texto: "Considerando el temblor muscular y la regulación de la tiroides, ¿cuál es la mejor síntesis del sistema térmico humano?",
        microTexto: `<h2>📖 Termorregulación muscular</h2><p>Las contracciones musculares, además de generar movimiento, producen calor como subproducto metabólico. Este fenómeno, conocido como termogénesis muscular, es fundamental para la regulación de la temperatura corporal en condiciones ambientales adversas. Durante la exposición al frío, el organismo activa mecanismos para aumentar la producción de calor mediante la contracción muscular involuntaria.</p><p>El temblor muscular es la respuesta más evidente a la disminución de la temperatura corporal. Consiste en contracciones rítmicas e involuntarias de los músculos esqueléticos que aumentan significativamente la producción de calor metabólico. Este mecanismo puede elevar la producción calórica hasta cinco veces por encima de los niveles basales, ayudando a mantener la temperatura corporal dentro de rangos seguros.</p><p>Además del temblor, existe la termogénesis sin temblor, mediada por tejido adiposo pardo, que también contribuye a la regulación térmica. La integración entre ambos mecanismos permite al organismo adaptarse a cambios ambientales. La incapacidad de generar suficiente calor puede llevar a condiciones peligrosas como la hipotermia, que afecta gravemente la función muscular y la supervivencia.</p>`,
        opciones: ["A) Es un proceso que depende solo de los huesos", "B) Es un modelo integrado de respuestas motoras, metabólicas y endocrinas", "C) Es una función que solo se activa durante el ejercicio", "D) Es un mecanismo que la tiroides controla eliminando el temblor"],
        correcta: "B", 
        explicacion: "N4: Síntesis de un modelo biológico multivariable." 
    },

    // -----------------------------------------------------------------------------
    // COMPETENCIA C: INDAGACIÓN (Evidencia, Inferencia y Visión Crítica)
    // -----------------------------------------------------------------------------
    { 
        id: 9, competencia: "C", nivel: "N1", 
        texto: "¿Qué capacidad de carga (resistencia) tiene el tendón de Aquiles según el texto?",
        microTexto: `<h2>📖 Tendón de Aquiles</h2><p>El tendón de Aquiles, también conocido como tendón calcáneo, es la estructura tendinosa más resistente del cuerpo humano. Este tendón conecta los músculos gastrocnemio y sóleo, principales músculos de la pantorrilla, con el hueso calcáneo del talón. Su nombre proviene del héroe mitológico griego Aquiles, cuya única vulnerabilidad era precisamente esta región.</p><p>La resistencia del tendón de Aquiles es extraordinaria. Estudios biomecánicos han demostrado que puede soportar fuerzas de hasta ocho veces el peso corporal durante actividades de alta intensidad como la carrera o el salto. Esta capacidad de soportar cargas extremas es posible gracias a la disposición altamente organizada de sus fibras de colágeno, que le confieren tanto resistencia a la tracción como cierta elasticidad.</p><p>Una ruptura del tendón de Aquiles constituye una lesión grave que compromete severamente la funcionalidad de la extremidad inferior. Los pacientes con esta lesión presentan incapacidad para realizar la flexión plantar del pie, lo que impide actividades fundamentales como caminar, correr o mantenerse en puntas de pie. La recuperación requiere intervención quirúrgica y rehabilitación prolongada.</p>`,
        opciones: ["A) La mitad del peso del cuerpo", "B) El mismo peso del cuerpo", "C) Ocho veces el peso del cuerpo", "D) Diez veces el peso del cuerpo"],
        correcta: "C", 
        explicacion: "N1: Identificación de evidencia cuantitativa." 
    },
    { 
        id: 10, competencia: "C", nivel: "N2", 
        texto: "Si un tratamiento se define como 'pilar del manejo sintomático', ¿qué se puede inferir sobre su efecto en la enfermedad?",
        microTexto: `<h2>📖 Distrofia muscular</h2><p>La distrofia muscular comprende un grupo de enfermedades genéticas caracterizadas por debilidad progresiva y pérdida de masa muscular. Estas condiciones son causadas por mutaciones en genes responsables de la producción de proteínas esenciales para la integridad estructural de las fibras musculares, siendo la distrofina la más conocida de estas proteínas.</p><p>El curso de la enfermedad varía según el tipo específico de distrofia, pero generalmente implica una progresión gradual que afecta primero a los músculos proximales de las extremidades y eventualmente compromete la función respiratoria y cardíaca. La debilidad muscular avanzada puede limitar significativamente la movilidad y la independencia funcional de quienes la padecen.</p><p>Actualmente no existe cura para las distrofias musculares, aunque la investigación científica avanza en diversas líneas terapéuticas. La terapia física y ocupacional constituye el pilar del manejo sintomático, ayudando a mantener la función muscular residual y prevenir contracturas. Los tratamientos farmacológicos, principalmente corticoides, pueden retrasar la progresión de la debilidad. La terapia génica y la edición genética representan las esperanzas más prometedoras para futuras intervenciones curativas.</p>`,
        opciones: ["A) Que el tratamiento cura el origen genético", "B) Que el tratamiento mitiga los efectos pero no elimina la causa", "C) Que el tratamiento es ineficaz y no debe usarse", "D) Que el paciente sanará por completo en pocos meses"],
        correcta: "B", 
        explicacion: "N2: Inferencia de conclusión clínica (Sintomático ≠ Curativo)." 
    },
    { 
        id: 11, competencia: "C", nivel: "N3", 
        texto: "¿De qué manera el acto de 'escribir sin mirar las manos' valida la hipótesis del sentido propioceptivo?",
        microTexto: `<h2>📖 Propiocepción</h2><p>La propiocepción es una capacidad sensorial fundamental que permite al organismo percibir la posición, orientación y movimiento de las diferentes partes del cuerpo sin necesidad de utilizar la visión. Este sentido, a menudo llamado el "sexto sentido", opera continuamente y de manera inconsciente, constituyendo la base de la coordinación motora fina y gruesa.</p><p>El sistema propioceptivo se basa en receptores especializados ubicados en músculos, tendones y articulaciones. Los husos musculares, por ejemplo, detectan cambios en la longitud muscular y la velocidad de estiramiento, mientras que los órganos tendinosos de Golgi monitorizan la tensión generada durante la contracción. Esta información es procesada por el sistema nervioso central para ajustar la actividad motora.</p><p>La importancia de la propiocepción se evidencia en actividades cotidianas que requieren precisión y coordinación. Al escribir en un teclado sin mirar las manos, al tocar un instrumento musical manteniendo la digitación exacta, o al practicar deportes que exigen ajustes posturales rápidos, estamos utilizando continuamente esta capacidad sensorial. Su alteración puede generar descoordinación, inestabilidad articular y dificultades para realizar movimientos precisos.</p>`,
        opciones: ["A) Demuestra que la memoria visual es superior", "B) Actúa como un experimento que aísla la variable visual para confirmar el sentido interno", "C) Prueba que los dedos no tienen terminaciones nerviosas", "D) Indica que escribir es una función puramente cardíaca"],
        correcta: "B", 
        explicacion: "N3: Validación de hipótesis mediante aislamiento de variables." 
    },
    { 
        id: 12, competencia: "C", nivel: "N4", 
        texto: "La frase 'el ejercicio trasciende el ámbito físico' implica que el autor sostiene una visión de salud:",
        microTexto: `<h2>📖 Ejercicio y bienestar integral</h2><p>La práctica regular de ejercicio físico ha sido tradicionalmente asociada con beneficios sobre el sistema musculoesquelético, como el aumento de la fuerza y la masa muscular, la mejora de la densidad ósea y la mayor flexibilidad articular. Sin embargo, la evidencia científica acumulada en las últimas décadas ha ampliado considerablemente esta visión, revelando efectos positivos que trascienden el ámbito puramente físico.</p><p>Investigaciones en neurociencia han demostrado que el ejercicio aeróbico promueve la neuroplasticidad, es decir, la capacidad del sistema nervioso para modificar su estructura y función en respuesta a la experiencia. Este proceso se asocia con mejoras en funciones cognitivas como la memoria, la atención y las funciones ejecutivas. Además, la actividad física regular reduce significativamente los niveles de estrés percibido, disminuye los síntomas de ansiedad y depresión, y promueve estados emocionales positivos.</p><p>Estudios epidemiológicos han establecido asociaciones consistentes entre la práctica habitual de ejercicio y mejor rendimiento académico en poblaciones escolares y universitarias. Esta relación se mantiene incluso después de controlar por variables socioeconómicas y educativas, sugiriendo un efecto directo de la actividad física sobre los procesos de aprendizaje y la función cognitiva.</p>`,
        opciones: ["A) Fragmentada, donde el cuerpo y la mente no se tocan", "B) Sistémica, donde la actividad física es un motor del desarrollo cognitivo y emocional", "C) Estética, enfocada solo en el aumento de la masa muscular", "D) Económica, basada en el acceso a gimnasios de alto costo"],
        correcta: "B", 
        explicacion: "N4: Evaluación de cosmovisión/Sustento de la tesis integral." 
    }
];

    // Diapositiva 0: Introducción motivacional
    const introSlide = `
        <div class="slide" data-index="0">
            <div class="texto-card" style="border: 2px solid #3b82f6; background:#eff6ff;">
                <h2 style="color:#3b82f6; text-align:center;">📖 ¿Por qué evaluamos Lectura Crítica?</h2>
                <p style="font-size:1.08rem;"><strong>Leer no es solo decodificar palabras.</strong> <strong style="color:#3b82f6;">Leer críticamente</strong> significa comprender, analizar, inferir y evaluar lo que otros escriben. Es la competencia que te permite acceder al conocimiento en <strong>TODAS las áreas</strong>.</p>
                <div style="display:flex; flex-wrap:wrap; gap:12px; justify-content:center; margin:20px 0;">
                    <div style="background:#ffffff; border-radius:20px; padding:10px 15px; text-align:center; border:1px solid #3b82f6;"><strong>🧪 Ciencias Naturales</strong><br>Interpretar experimentos</div>
                    <div style="background:#ffffff; border-radius:20px; padding:10px 15px; text-align:center; border:1px solid #3b82f6;"><strong>📐 Matemáticas</strong><br>Comprender enunciados</div>
                    <div style="background:#ffffff; border-radius:20px; padding:10px 15px; text-align:center; border:1px solid #3b82f6;"><strong>🌎 Sociales</strong><br>Analizar fuentes históricas</div>
                    <div style="background:#ffffff; border-radius:20px; padding:10px 15px; text-align:center; border:1px solid #3b82f6;"><strong>🇬🇧 Inglés</strong><br>Comprender textos</div>
                </div>
                <div style="background:#ffffff; border-radius:20px; padding:15px; margin-top:10px;">
                    <p>📊 <strong>Dato ICFES:</strong> Lectura Crítica correlaciona <strong style="color:#3b82f6;">0.78 con Ciencias Naturales</strong> y <strong style="color:#3b82f6;">0.82 con Sociales</strong>.</p>
                    <p>✅ <strong>Leer bien = mejorar todas tus competencias.</strong> Hoy ejercitamos con 12 textos sobre el sistema muscular y preguntas estilo Saber 11°.</p>
                </div>
                <div style="text-align:center; margin-top:20px;"><div style="background:#3b82f6; display:inline-block; padding:8px 24px; border-radius:60px; color:white;">👉 Usa las flechas ◀ ▶ para avanzar</div></div>
            </div>
        </div>
    `;

    // Construir slides: intro + 12 preguntas
    let slides = [introSlide];
    
    preguntas.forEach((p, idx) => {
        const num = idx + 1;
        const opsHtml = p.opciones.map(op => `<div class="opcion">${op}</div>`).join('');
        slides.push(`
            <div class="slide" data-index="${idx+1}">
                <div class="texto-card">
                    ${p.microTexto}
                </div>
                <div class="pregunta-card">
                    <div class="header-pregunta">
                        <div class="badge-competencia">📌 Competencia ${p.competencia}</div>
                        <button class="btn-revelar" data-idx="${idx}">🔍 Mostrar respuesta</button>
                    </div>
                    <div class="pregunta-texto">${num}. ${p.texto}</div>
                    <div class="opciones">${opsHtml}</div>
                    <div class="respuesta-info" id="resp-${idx}">
                        <div class="respuesta-correcta">✅ Respuesta correcta: ${p.correcta}</div>
                        <div class="explicacion">📖 ${p.explicacion}</div>
                    </div>
                </div>
            </div>
        `);
    });
    
    // Tabla final de autoevaluación - CORREGIDA (sin errores de concatenación)
    function generarTablaFinal() {
        let filas = '';
        for (let i = 0; i < preguntas.length; i++) {
            const p = preguntas[i];
            filas += `<tr>
                <td>${i+1}</td>
                <td><strong>${p.correcta}</strong></td>
                <td>${p.competencia}</td>
                <td><input type="text" id="inp-${i}" placeholder="A/B/C/D" maxlength="1" style="background:#fff; border:2px solid #3b82f6; padding:4px; width:55px; text-align:center; border-radius:20px; text-transform:uppercase;"></td>
                <td id="est-${i}">—</td>
            </tr>`;
        }
        return `
            <div class="slide" data-index="13">
                <div class="tabla-final-card">
                    <h2>📊 AUTOEVALUACIÓN - LECTURA CRÍTICA</h2>
                    <p style="text-align:center; margin-bottom:12px;">✏️ Escribe tu respuesta (A, B, C o D) y presiona "Calificar"</p>
                    <table class="tabla-resumen">
                        <thead>
                            <tr><th>#</th><th>Correcta</th><th>Comp.</th><th>Mi respuesta</th><th>Resultado</th></tr>
                        </thead>
                        <tbody>${filas}</tbody>
                    </table>
                    <div style="display:flex; justify-content:center; gap:15px; margin:15px 0;">
                        <button id="btnCalificar" class="btn-calcular">✅ Calificar</button>
                        <button id="btnLimpiarTodo" class="btn-calcular" style="background:#94a3b8;">🗑️ Limpiar</button>
                    </div>
                    <div class="resultado-total">
                        <p><strong>Tu porcentaje:</strong> <span id="porcentajeFinal" class="porcentaje-big">0%</span></p>
                        <p id="msgMeta">🔹 Completa tus respuestas y califica</p>
                    </div>
                    <div style="background:#eff6ff; border-radius:20px; padding:12px; text-align:center; margin-top:15px;">
                        <p>🧠 <strong>Metacognición:</strong> Reflexiona sobre tus dificultades: literalidad (N1), contexto (N2), inferencia (N3) o evaluación (N4)</p>
                    </div>
                </div>
            </div>
        `;
    }
    slides.push(generarTablaFinal());
    
    const container = document.getElementById("presentation");
    container.innerHTML = slides.join('');
    
    let current = 0;
    const allSlides = document.querySelectorAll('.slide');
    const total = allSlides.length;
    
    function update() {
        allSlides.forEach((s, i) => { if(i === current) s.classList.add('active'); else s.classList.remove('active'); });
        document.getElementById('slideCounter').innerText = `Diapositiva ${current+1} / ${total}`;
        if(current === total-1) activarAutoevaluacion();
    }
    
    document.getElementById('nextBtn').onclick = () => { if(current < total-1) { current++; update(); } };
    document.getElementById('prevBtn').onclick = () => { if(current > 0) { current--; update(); } };
    window.addEventListener('keydown', e => { if(e.key === 'ArrowRight' && current<total-1) current++; else if(e.key === 'ArrowLeft' && current>0) current--; update(); });
    update();
    
    function attachReveal() {
        document.querySelectorAll('.btn-revelar').forEach(btn => {
            btn.onclick = () => {
                const idx = btn.getAttribute('data-idx');
                const div = document.getElementById(`resp-${idx}`);
                if(div) {
                    div.classList.toggle('visible');
                    btn.textContent = div.classList.contains('visible') ? '🙈 Ocultar' : '🔍 Mostrar respuesta';
                }
            };
        });
    }
    attachReveal();
    new MutationObserver(() => attachReveal()).observe(container, { childList: true, subtree: true });
    
    function activarAutoevaluacion() {
        const btnCal = document.getElementById('btnCalificar');
        const btnLim = document.getElementById('btnLimpiarTodo');
        if(!btnCal) return;
        
        btnCal.onclick = () => {
            let aciertos = 0;
            for(let i=0; i<preguntas.length; i++) {
                const inp = document.getElementById(`inp-${i}`);
                const est = document.getElementById(`est-${i}`);
                const user = inp?.value.trim().toUpperCase();
                const correcta = preguntas[i].correcta;
                if(user === correcta) { 
                    est.innerHTML = '✅ Correcta'; 
                    est.style.color = '#16a34a'; 
                    aciertos++; 
                } else { 
                    est.innerHTML = `❌ (era ${correcta})`; 
                    est.style.color = '#dc2626'; 
                }
            }
            const pct = Math.round((aciertos/12)*100);
            document.getElementById('porcentajeFinal').innerText = `${pct}%`;
            const msg = document.getElementById('msgMeta');
            if(pct>=70) msg.innerHTML = '🎉 ¡Excelente! Sigue fortaleciendo inferencia y evaluación.';
            else if(pct>=50) msg.innerHTML = '📘 Buen trabajo. Revisa las preguntas donde fallaste.';
            else msg.innerHTML = '📌 Sigue practicando. Usa "Mostrar respuesta" para aprender.';
            
            let extra = document.getElementById('adicionalAciertos');
            if(!extra) { 
                const np = document.createElement('p'); 
                np.id='adicionalAciertos'; 
                np.style.marginTop='10px'; 
                np.style.fontWeight='bold'; 
                np.style.color='#3b82f6'; 
                np.innerHTML = `✅ Aciertos: ${aciertos}/12`; 
                document.querySelector('.resultado-total').appendChild(np); 
            } else { 
                extra.innerHTML = `✅ Aciertos: ${aciertos}/12`; 
            }
        };
        
        btnLim.onclick = () => {
            for(let i=0; i<preguntas.length; i++) {
                const inp = document.getElementById(`inp-${i}`);
                const est = document.getElementById(`est-${i}`);
                if(inp) inp.value = '';
                if(est) { est.innerHTML = '—'; est.style.color = '#1e293b'; }
            }
            document.getElementById('porcentajeFinal').innerText = '0%';
            document.getElementById('msgMeta').innerHTML = '🔹 Completa tus respuestas y califica';
            const extra = document.getElementById('adicionalAciertos');
            if(extra) extra.remove();
        };
    }
</script>
</body>
</html>

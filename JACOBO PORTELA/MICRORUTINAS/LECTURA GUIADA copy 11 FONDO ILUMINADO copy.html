        { // P11 - Competencia C, N3

            microTexto: "La propiocepción es una capacidad sensorial fundamental que permite al organismo percibir la posición, orientación y movimiento de las diferentes partes del cuerpo sin necesidad de utilizar la visión. Este sentido, a menudo llamado el 'sexto sentido', opera continuamente y de manera inconsciente, constituyendo la base de la coordinación motora fina y gruesa. El sistema propioceptivo se basa en receptores especializados ubicados en músculos, tendones y articulaciones. Los husos musculares, por ejemplo, detectan cambios en la longitud muscular y la velocidad de estiramiento, mientras que los órganos tendinosos de Golgi monitorizan la tensión generada durante la contracción. Esta información es procesada por el sistema nervioso central para ajustar la actividad motora. La importancia de la propiocepción se evidencia en actividades cotidianas que requieren precisión y coordinación. Al escribir en un teclado sin mirar las manos, al tocar un instrumento musical manteniendo la digitación exacta, o al practicar deportes que exigen ajustes posturales rápidos, estamos utilizando continuamente esta capacidad sensorial. Su alteración puede generar descoordinación, inestabilidad articular y dificultades para realizar movimientos precisos.",
            pregunta: "El texto utiliza la estrategia discursiva de ejemplificar con actividades como escribir en un teclado, tocar un instrumento musical o practicar deportes para:",
            opciones: [
                "A) Demostrar que estas actividades requieren mayor esfuerzo físico que otras",
                "B) Validar la afirmación sobre la importancia de la propiocepción en tareas cotidianas",
                "C) Confundir al lector con una lista extensa de actividades especializadas",
                "D) Establecer una jerarquía de dificultad entre diferentes tipos de deportes"
            ]
        },
        { // P12 - Competencia C, N4
            id: 12, competencia: "C", nivel: "N4", correcta: 2,
            microTexto: "La práctica regular de ejercicio físico ha sido tradicionalmente asociada con beneficios sobre el sistema musculoesquelético, como el aumento de la fuerza y la masa muscular, la mejora de la densidad ósea y la mayor flexibilidad articular. Sin embargo, la evidencia científica acumulada en las últimas décadas ha ampliado considerablemente esta visión, revelando efectos positivos que trascienden el ámbito puramente físico. Investigaciones en neurociencia han demostrado que el ejercicio aeróbico promueve la neuroplasticidad, es decir, la capacidad del sistema nervioso para modificar su estructura y función en respuesta a la experiencia. Este proceso se asocia con mejoras en funciones cognitivas como la memoria, la atención y las funciones ejecutivas. Además, la actividad física regular reduce significativamente los niveles de estrés percibido, disminuye los síntomas de ansiedad y depresión, y promueve estados emocionales positivos. Estudios epidemiológicos han establecido asociaciones consistentes entre la práctica habitual de ejercicio y mejor rendimiento académico en poblaciones escolares y universitarias. Esta relación se mantiene incluso después de controlar por variables socioeconómicas y educativas, sugiriendo un efecto directo de la actividad física sobre los procesos de aprendizaje y la función cognitiva.",
            pregunta: "La afirmación del texto —'la evidencia científica acumulada ha revelado efectos positivos que trascienden el ámbito puramente físico'— revela una visión de mundo que:",
            opciones: [
                "A) Reduce los beneficios del ejercicio exclusivamente al fortalecimiento del sistema musculoesquelético",
                "B) Considera el ejercicio como una actividad exclusivamente recreativa sin impacto significativo en la salud",
                "C) Integra dimensiones físicas, cognitivas, emocionales y educativas del bienestar humano",
                "D) Desconoce la relación documentada entre actividad física y salud mental"
            ]
        }
    ];

    // ---------- ESTADO ----------
    let currentIndex = 0;
    let respuestas = new Array(preguntas.length).fill(null);
    let tiempos = new Array(preguntas.length).fill(null);
    let startTime = null;
    let timerInterval = null;
    let fontSizeMultiplier = 1.0;
    const baseFontSize = 16;

    const microTextEl = document.getElementById('microText');
    const questionTextEl = document.getElementById('questionText');
    const optionsContainer = document.getElementById('optionsContainer');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const questionCounter = document.getElementById('questionCounter');
    const timerDisplay = document.getElementById('timerDisplay');

    function applyFontSize() {
        const root = document.getElementById('app');
        root.style.fontSize = (baseFontSize * fontSizeMultiplier) + 'px';
        const microText = document.querySelector('.micro-text');
        const options = document.querySelectorAll('.option');
        if (microText) microText.style.fontSize = `${0.95 * fontSizeMultiplier}rem`;
        options.forEach(opt => opt.style.fontSize = `${1.05 * fontSizeMultiplier}rem`);
    }

    document.getElementById('fontPlus').addEventListener('click', () => {
        if (fontSizeMultiplier < 1.5) {
            fontSizeMultiplier += 0.1;
            applyFontSize();
        }
    });
    document.getElementById('fontMinus').addEventListener('click', () => {
        if (fontSizeMultiplier > 0.7) {
            fontSizeMultiplier -= 0.1;
            applyFontSize();
        }
    });

    function startTimer() {
        if (timerInterval) clearInterval(timerInterval);
        startTime = performance.now();
        timerInterval = setInterval(() => {
            if (startTime) {
                const elapsed = (performance.now() - startTime) / 1000;
                timerDisplay.textContent = elapsed.toFixed(1) + ' s';
            }
        }, 100);
    }

    function stopTimer() {
        if (timerInterval && startTime) {
            const elapsed = (performance.now() - startTime) / 1000;
            tiempos[currentIndex] = elapsed;
            clearInterval(timerInterval);
            timerInterval = null;
            startTime = null;
        }
    }

    function saveAnswer(selectedIdx) {
        respuestas[currentIndex] = selectedIdx;
        if (startTime !== null) stopTimer();
        renderCurrentQuestion();
    }

    function renderCurrentQuestion() {
        const q = preguntas[currentIndex];
        microTextEl.textContent = q.microTexto;
        questionTextEl.textContent = q.pregunta;

        optionsContainer.innerHTML = '';
        q.opciones.forEach((opt, idx) => {
            const div = document.createElement('div');
            div.className = 'option';
            if (respuestas[currentIndex] === idx) div.classList.add('selected');
            div.textContent = opt;
            div.addEventListener('click', () => {
                saveAnswer(idx);
            });
            optionsContainer.appendChild(div);
        });

        questionCounter.textContent = `Pregunta ${currentIndex+1} / ${preguntas.length} | ${q.competencia} - ${q.nivel}`;
        prevBtn.disabled = (currentIndex === 0);
        nextBtn.textContent = (currentIndex === preguntas.length-1) ? 'Finalizar' : 'Siguiente ▶';

        if (respuestas[currentIndex] === null && startTime === null) {
            startTimer();
        } else if (respuestas[currentIndex] !== null) {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = null;
            startTime = null;
            if (tiempos[currentIndex] !== null) {
                timerDisplay.textContent = tiempos[currentIndex].toFixed(1) + ' s ✓';
            }
        }
    }

    function goToNext() {
        if (currentIndex < preguntas.length - 1) {
            if (timerInterval) clearInterval(timerInterval);
            startTime = null;
            timerInterval = null;
            currentIndex++;
            renderCurrentQuestion();
        } else {
            if (timerInterval) clearInterval(timerInterval);
            alert('✅ Evaluación completada. Revisa la consola para ver tiempos y respuestas.');
            console.table(preguntas.map((p, i) => ({
                id: p.id,
                competencia: p.competencia,
                nivel: p.nivel,
                respuestaCorrecta: p.correcta,
                respuestaUsuario: respuestas[i],
                acierto: respuestas[i] === p.correcta ? '✓' : '✗',
                tiempo_segundos: tiempos[i]?.toFixed(2) || 'N/A'
            })));
        }
    }

    function goToPrev() {
        if (currentIndex > 0) {
            if (timerInterval) clearInterval(timerInterval);
            startTime = null;
            timerInterval = null;
            currentIndex--;
            renderCurrentQuestion();
        }
    }

    prevBtn.addEventListener('click', goToPrev);
    nextBtn.addEventListener('click', goToNext);

    renderCurrentQuestion();
    applyFontSize();
</script>
</body>
</html>

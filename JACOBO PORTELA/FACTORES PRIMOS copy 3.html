<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🪐 Nivel 4: Descomposición cuántica (M.C.D. de 5 números)</title>
<style>
  body {
    background: radial-gradient(circle at center, #000010 0%, #000 100%);
    color: #fff;
    font-family: "Press Start 2P", monospace;
    text-align: center;
    padding: 20px;
    overflow: hidden;
  }
  h1 { color: #00ffcc; text-shadow: 2px 2px #ff00ff; }

  .contenedor {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 40px;
    margin-top: 30px;
  }
  .zonaNumeros {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
  }
  .capsulas {
    display: flex;
    align-items: center;
    gap: 15px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .capsula {
    background: #111;
    border: 3px solid #00ffcc;
    width: 90px; height: 90px;
    display: flex;
    justify-content: center;
    align-items: center;
    border-radius: 12px;
    font-size: 22px;
    box-shadow: 0 0 15px #00ffcc;
    transition: all 0.3s ease;
  }
  .capsula.reducida { background: #222; transform: scale(0.9); }

  #panel {
    width: 120px; height: 120px;
    background: #222;
    border: 3px dashed #00ffcc;
    border-radius: 10px;
    display: flex;
    align-items: center; justify-content: center;
    color: #00ffcc;
    font-size: 30px;
  }
  .divisor {
    display: inline-block;
    width: 60px; height: 60px;
    margin: 10px;
    line-height: 60px;
    border-radius: 10px;
    font-weight: bold;
    cursor: grab;
    font-size: 24px;
    color: black;
  }
  .p2 { background: #00ffcc; }
  .p3 { background: #ff00ff; }
  .p5 { background: #ffff00; }
  .p7 { background: #ff6600; }
  .p11 { background: #ff99ff; }

  /* Panel lateral */
  #panelFactores {
    width: 350px;
    min-height: 270px;
    background: rgba(0, 255, 204, 0.1);
    border: 2px solid #00ffcc;
    border-radius: 10px;
    padding: 10px;
    font-size: 12px;
    text-align: left;
    line-height: 1.6;
    box-shadow: 0 0 20px #00ffcc inset;
  }
  #panelFactores h3 {
    font-size: 14px;
    color: #00ffcc;
    text-shadow: 1px 1px 2px #ff00ff;
    margin-top: 0;
    border-bottom: 1px dashed #00ffcc;
  }

  #astronauta {
    margin-top: 25px;
    font-size: 60px;
    opacity: 0;
    transition: opacity 1s ease-in-out;
    animation: flotar 3s infinite ease-in-out;
  }
  @keyframes flotar {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-20px); }
    100% { transform: translateY(0px); }
  }

  #consola {
    margin: 25px auto;
    width: 80%;
    background: rgba(0,0,0,0.6);
    border: 2px solid #00ffcc;
    padding: 12px;
    text-align: left;
    font-size: 14px;
    height: 130px;
    overflow-y: auto;
    border-radius: 10px;
  }

  .cursor {
    display: inline-block;
    width: 8px;
    background: #00ffcc;
    animation: blink 1.2s infinite;
  }
  @keyframes blink {
    0%, 50% { opacity: 1; }
    51%, 100% { opacity: 0; }
  }

  #btnSiguiente {
    background: #00ffcc;
    color: black;
    border: none;
    padding: 10px 20px;
    font-family: "Press Start 2P";
    font-size: 12px;
    border-radius: 6px;
    cursor: pointer;
    margin-top: 15px;
    display: none;
  }
  #btnSiguiente:hover {
    background: #00ffaa;
  }
</style>
</head>
<body>

<h1>🪐 Nivel 4: Descomposición cuántica (M.C.D. de 5 números)</h1>
<p>Arrastra un divisor hacia el panel para dividir los cinco números simultáneamente.</p>

<div class="contenedor">
  <div class="zonaNumeros">
    <div class="capsulas">
      <div id="num1" class="capsula">36</div>
      <div id="num2" class="capsula">48</div>
      <div id="num3" class="capsula">60</div>
      <div id="num4" class="capsula">72</div>
      <div id="num5" class="capsula">90</div>
    </div>

    <div id="panel" ondragover="permitirDrop(event)" ondrop="soltar(event)">⇅</div>

    <div id="divisores">
      <div class="divisor p2" draggable="true" ondragstart="arrastrar(event)" id="f2">2</div>
      <div class="divisor p3" draggable="true" ondragstart="arrastrar(event)" id="f3">3</div>
      <div class="divisor p5" draggable="true" ondragstart="arrastrar(event)" id="f5">5</div>
      <div class="divisor p7" draggable="true" ondragstart="arrastrar(event)" id="f7">7</div>
      <div class="divisor p11" draggable="true" ondragstart="arrastrar(event)" id="f11">11</div>
    </div>
  </div>

  <div id="panelFactores">
    <h3>🧮 Cálculo visual del M.C.D.</h3>
    <div id="divisiones"></div>
    <div id="listaFactores"></div>
    <div id="productoMCD"></div>
  </div>
  <button id="btnSiguiente" onclick="nuevaMision()">🔁 Siguiente misión</button>
</div>

<div id="astronauta">👨‍🚀</div>
<div id="consola"></div>


<!-- 🎵 Sonidos -->
<audio id="sndOk" src="https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg"></audio>
<audio id="sndError" src="https://actions.google.com/sounds/v1/cartoon/boing.ogg"></audio>
<audio id="sndSuccess" src="https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg"></audio>

<script>
// Lista completa de 53 misiones (5 números por misión) manteniendo la propiedad del MCD.

        let misiones = [
            // ===================================
            // Misiones Originales (MCDs: 6, 42, 15)
            // ===================================
            [36, 48, 60, 72, 90],         // MCD 6
            [84, 126, 210, 252, 420],     // MCD 42
            [45, 75, 105, 135, 195],      // MCD 15

            // ===================================
            // Nuevas Misiones con MCD = 6 (20 ejemplos)
            // Forma: 6x, 6y, 6z, 6w, 6v | MCD(x, y, z, w, v) = 1
            // ===================================
            [6, 12, 18, 24, 30],        // 6*1, 6*2, 6*3, 6*4, 6*5
            [6, 12, 24, 36, 48],        // 6*1, 6*2, 6*4, 6*6, 6*8
            [12, 18, 24, 30, 36],       // 6*2, 6*3, 6*4, 6*5, 6*6
            [18, 24, 30, 36, 42],       // 6*3, 6*4, 6*5, 6*6, 6*7
            [30, 36, 42, 48, 54],       // 6*5, 6*6, 6*7, 6*8, 6*9
            [6, 30, 60, 90, 120],       // 6*1, 6*5, 6*10, 6*15, 6*20
            [12, 30, 60, 90, 150],      // 6*2, 6*5, 6*10, 6*15, 6*25
            [6, 18, 30, 42, 54],        // 6*1, 6*3, 6*5, 6*7, 6*9
            [6, 24, 42, 60, 78],        // 6*1, 6*4, 6*7, 6*10, 6*13
            [12, 24, 36, 48, 66],       // 6*2, 6*4, 6*6, 6*8, 6*11
            [6, 30, 48, 66, 84],        // 6*1, 6*5, 6*8, 6*11, 6*14
            [12, 30, 48, 66, 90],       // 6*2, 6*5, 6*8, 6*11, 6*15
            [18, 30, 48, 66, 102],      // 6*3, 6*5, 6*8, 6*11, 6*17
            [6, 12, 24, 42, 72],        // 6*1, 6*2, 6*4, 6*7, 6*12
            [30, 42, 54, 72, 90],       // 6*5, 6*7, 6*9, 6*12, 6*15
            [6, 102, 114, 126, 138],    // 6*1, 6*17, 6*19, 6*21, 6*23
            [6, 78, 96, 114, 132],      // 6*1, 6*13, 6*16, 6*19, 6*22
            [24, 48, 72, 96, 120],      // 6*4, 6*8, 6*12, 6*16, 6*20
            [48, 60, 72, 84, 96],       // 6*8, 6*10, 6*12, 6*14, 6*16
            [6, 30, 42, 54, 66],        // 6*1, 6*5, 6*7, 6*9, 6*11

            // ===================================
            // Nuevas Misiones con MCD = 42 (15 ejemplos)
            // Forma: 42x, 42y, 42z, 42w, 42v | MCD(x, y, z, w, v) = 1
            // ===================================
            [42, 84, 126, 168, 210],    // 42*1, 42*2, 42*3, 42*4, 42*5
            [42, 84, 168, 252, 336],    // 42*1, 42*2, 42*4, 42*6, 42*8
            [84, 126, 168, 210, 252],   // 42*2, 42*3, 42*4, 42*5, 42*6
            [126, 168, 210, 252, 294],  // 42*3, 42*4, 42*5, 42*6, 42*7
            [42, 210, 420, 630, 840],   // 42*1, 42*5, 42*10, 42*15, 42*20
            [42, 126, 210, 294, 378],   // 42*1, 42*3, 42*5, 42*7, 42*9
            [42, 168, 294, 420, 546],   // 42*1, 42*4, 42*7, 42*10, 42*13
            [84, 126, 168, 210, 294],   // 42*2, 42*3, 42*4, 42*5, 42*7
            [42, 84, 126, 210, 294],    // 42*1, 42*2, 42*3, 42*5, 42*7
            [42, 126, 168, 294, 420],   // 42*1, 42*3, 42*4, 42*7, 42*10
            [210, 252, 294, 336, 378],  // 42*5, 42*6, 42*7, 42*8, 42*9
            [42, 84, 168, 210, 336],    // 42*1, 42*2, 42*4, 42*5, 42*8
            [42, 126, 210, 252, 378],   // 42*1, 42*3, 42*5, 42*6, 42*9
            [84, 168, 252, 336, 420],   // 42*2, 42*4, 42*6, 42*8, 42*10
            [42, 84, 210, 252, 420],    // 42*1, 42*2, 42*5, 42*6, 42*10

            // ===================================
            // Nuevas Misiones con MCD = 15 (15 ejemplos)
            // Forma: 15x, 15y, 15z, 15w, 15v | MCD(x, y, z, w, v) = 1
            // ===================================
            [15, 30, 45, 60, 75],       // 15*1, 15*2, 15*3, 15*4, 15*5
            [15, 30, 60, 90, 120],      // 15*1, 15*2, 15*4, 15*6, 15*8
            [30, 45, 60, 75, 90],       // 15*2, 15*3, 15*4, 15*5, 15*6
            [45, 60, 75, 90, 105],      // 15*3, 15*4, 15*5, 15*6, 15*7
            [15, 75, 150, 225, 300],    // 15*1, 15*5, 15*10, 15*15, 15*20
            [15, 45, 75, 105, 135],     // 15*1, 15*3, 15*5, 15*7, 15*9
            [15, 60, 105, 150, 195],    // 15*1, 15*4, 15*7, 15*10, 15*13
            [30, 45, 60, 90, 120],      // 15*2, 15*3, 15*4, 15*6, 15*8
            [15, 30, 45, 75, 105],      // 15*1, 15*2, 15*3, 15*5, 15*7
            [15, 45, 60, 90, 120],      // 15*1, 15*3, 15*4, 15*6, 15*8
            [75, 90, 105, 120, 135],    // 15*5, 15*6, 15*7, 15*8, 15*9
            [15, 30, 60, 75, 105],      // 15*1, 15*2, 15*4, 15*5, 15*7
            [15, 45, 75, 90, 120],      // 15*1, 15*3, 15*5, 15*6, 15*8
            [30, 60, 90, 120, 150],     // 15*2, 15*4, 15*6, 15*8, 15*10
            [15, 45, 105, 135, 165]     // 15*1, 15*3, 15*7, 15*9, 15*11
        ];
let actual = 0;
let nums = [];
let mcd = 1;
let factoresUsados = [];

function iniciarMision(){
  if(actual >= misiones.length) actual = 0;
  nums = [...misiones[actual]];
  mcd = 1;
  factoresUsados = [];
  actualizarCapsulas(true);
  limpiarPanel();
  document.getElementById("btnSiguiente").style.display = "none";
  document.getElementById("astronauta").style.opacity = 0;
  narrar(`Iniciando misión ${actual+1}. Encuentra los divisores comunes de ${nums.join(", ")}.`);
}

function arrastrar(ev){ ev.dataTransfer.setData("text", ev.target.id); }
function permitirDrop(ev){ ev.preventDefault(); }

function soltar(ev){
  ev.preventDefault();
  const id = ev.dataTransfer.getData("text");
  const factor = parseInt(document.getElementById(id).textContent);
  const sndOk = document.getElementById("sndOk");
  const sndErr = document.getElementById("sndError");

  const todosDividen = nums.every(n => n % factor === 0);

  if(todosDividen){
    const anteriores = [...nums];
    nums = nums.map(n => n / factor);
    mcd *= factor;
    factoresUsados.push(factor);
    actualizarCapsulas();
    actualizarPanel(anteriores, factor);
    narrar(`Excelente. ${factor} divide a los cinco números.`);
    sndOk.play();
    if(!tieneComunes()) completarMision();
  } else {
    narrar(`El ${factor} no divide a todos. Intenta otro.`);
    sndErr.play();
  }
}

function actualizarCapsulas(reset=false){
  for(let i=0;i<5;i++){
    let c=document.getElementById(`num${i+1}`);
    c.textContent=nums[i];
    if(!reset){
      c.classList.add("reducida");
      setTimeout(()=>c.classList.remove("reducida"),400);
    }
  }
}

function actualizarPanel(prevs, f){
  const divs=document.getElementById("divisiones");
  const lista=document.getElementById("listaFactores");
  const prod=document.getElementById("productoMCD");
  prevs.forEach((p,i)=> divs.innerHTML += `🧩 ${p} ÷ ${f} = ${nums[i]}<br>`);
  lista.innerHTML=`Factores comunes: ${factoresUsados.join(" × ")}`;
  prod.innerHTML=`Producto parcial: ${mcd}`;
}

function limpiarPanel(){
  document.getElementById("divisiones").innerHTML="";
  document.getElementById("listaFactores").innerHTML="";
  document.getElementById("productoMCD").innerHTML="";
}

function tieneComunes(){
  const primos=[2,3,5,7,11];
  return primos.some(p=>nums.every(n=>n%p===0));
}

function completarMision(){
  narrar(`¡Misión completada! El M.C.D. de los cinco números es ${mcd}, formado por los factores ${factoresUsados.join(", ")}.`);
  document.getElementById("astronauta").style.opacity=1;
  document.getElementById("sndSuccess").play();
  document.getElementById("btnSiguiente").style.display="inline-block";
  document.getElementById("productoMCD").innerHTML += `<br>✅ <b>M.C.D. final = ${mcd}</b>`;
}

function nuevaMision(){
  actual++;
  iniciarMision();
}

function narrar(texto){
  const consola=document.getElementById("consola");
  const linea=document.createElement("div");
  consola.appendChild(linea);
  consola.scrollTop=consola.scrollHeight;

  const voz=new SpeechSynthesisUtterance(texto);
  voz.lang="es-ES";
  voz.pitch=0.6;
  voz.rate=0.85;
  speechSynthesis.speak(voz);

  let i=0;
  function typeWriter(){
    if(i<texto.length){
      linea.innerHTML=texto.substring(0,i+1)+'<span class="cursor"></span>';
      i++;
      setTimeout(typeWriter,35);
    } else linea.innerHTML=texto;
  }
  typeWriter();
}

window.onload=iniciarMision;
</script>
</body>
</html>

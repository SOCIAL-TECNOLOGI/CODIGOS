<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🪐 Nivel 2: Descomposición simultánea (M.C.D.)</title>
<style>
  body {
    background: radial-gradient(circle at center, #000010 0%, #000 100%);
    color: #fff;
    font-family: "Press Start 2P", monospace;
    text-align: center;
    padding: 20px;
    overflow: hidden;
  }
  h1 {
    color: #00ffcc;
    text-shadow: 2px 2px #ff00ff;
  }
  .contenedor {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 50px;
    margin-top: 40px;
  }
  .zonaNumeros {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
  }
  .capsulas {
    display: flex;
    align-items: center;
    gap: 30px;
  }
  .capsula {
    background: #111;
    border: 4px solid #00ffcc;
    width: 140px; height: 140px;
    display: flex;
    justify-content: center;
    align-items: center;
    border-radius: 15px;
    font-size: 36px;
    box-shadow: 0 0 20px #00ffcc;
    transition: all 0.3s ease;
  }
  .capsula.reducida { background: #222; transform: scale(0.9); }
  #panel {
    width: 120px; height: 120px;
    background: #222;
    border: 3px dashed #00ffcc;
    border-radius: 10px;
    display: flex;
    align-items: center; justify-content: center;
    color: #00ffcc;
  }
  .divisor {
    display: inline-block;
    width: 60px; height: 60px;
    margin: 10px;
    line-height: 60px;
    border-radius: 10px;
    font-weight: bold;
    cursor: grab;
    font-size: 24px;
    color: black;
  }
  .p2 { background: #00ffcc; }
  .p3 { background: #ff00ff; }
  .p5 { background: #ffff00; }
  .p7 { background: #ff6600; }
  .p11 { background: #ff99ff; }

  /* Panel lateral */
  #panelFactores {
    width: 320px;
    min-height: 250px;
    background: rgba(0, 255, 204, 0.1);
    border: 2px solid #00ffcc;
    border-radius: 10px;
    padding: 10px;
    font-size: 20px;
    text-align: left;
    line-height: 1.6;
    box-shadow: 0 0 20px #00ffcc inset;
  }
  #panelFactores h3 {
    font-size: 14px;
    color: #00ffcc;
    text-shadow: 1px 1px 2px #ff00ff;
    margin-top: 0;
    border-bottom: 1px dashed #00ffcc;
  }
  #listaFactores, #divisiones, #productoMCD {
    margin-top: 5px;
  }

  #astronauta {
    margin-top: 25px;
    font-size: 60px;
    opacity: 0;
    transition: opacity 1s ease-in-out;
    animation: flotar 3s infinite ease-in-out;
  }
  @keyframes flotar {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-20px); }
    100% { transform: translateY(0px); }
  }

  #consola {
    margin: 25px auto;
    width: 80%;
    background: rgba(0,0,0,0.6);
    border: 2px solid #00ffcc;
    padding: 12px;
    text-align: left;
    font-size: 14px;
    height: 130px;
    overflow-y: auto;
    border-radius: 10px;
  }

  .cursor {
    display: inline-block;
    width: 8px;
    background: #00ffcc;
    animation: blink 1.2s infinite;
  }
  @keyframes blink {
    0%, 50% { opacity: 1; }
    51%, 100% { opacity: 0; }
  }

  #btnSiguiente {
    background: #00ffcc;
    color: black;
    border: none;
    padding: 10px 20px;
    font-family: "Press Start 2P";
    font-size: 12px;
    border-radius: 6px;
    cursor: pointer;
    margin-top: 15px;
    display: none;
  }
  #btnSiguiente:hover {
    background: #00ffaa;
  }
</style>
</head>
<body>

<h1>🪐 Nivel 2: Descomposición simultánea (M.C.D.)</h1>
<p>Arrastra un divisor hacia el panel central para dividir simultáneamente ambos números.</p>

<div class="contenedor">
  <div class="zonaNumeros">
    <div class="capsulas">
      <div id="num1" class="capsula">48</div>
      <div id="panel" ondragover="permitirDrop(event)" ondrop="soltar(event)">⇅</div>
      <div id="num2" class="capsula">72</div>
    </div>

    <div id="divisores">
      <div class="divisor p2" draggable="true" ondragstart="arrastrar(event)" id="f2">2</div>
      <div class="divisor p3" draggable="true" ondragstart="arrastrar(event)" id="f3">3</div>
      <div class="divisor p5" draggable="true" ondragstart="arrastrar(event)" id="f5">5</div>
      <div class="divisor p7" draggable="true" ondragstart="arrastrar(event)" id="f7">7</div>
      <div class="divisor p11" draggable="true" ondragstart="arrastrar(event)" id="f11">11</div>
    </div>
  </div>

  <div id="panelFactores">
    <h3>🧮 Cálculo visual del M.C.D.</h3>
    <div id="divisiones"></div>
    <div id="listaFactores"></div>
    <div id="productoMCD"></div>
  </div>
  <button id="btnSiguiente" onclick="nuevaMision()">🔁 Siguiente misión</button>
</div>

<div id="astronauta">👨‍🚀</div>
<div id="consola"></div>


<!-- 🎵 Sonidos -->
<audio id="sndOk" src="https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg"></audio>
<audio id="sndError" src="https://actions.google.com/sounds/v1/cartoon/boing.ogg"></audio>
<audio id="sndSuccess" src="https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg"></audio>

<script>
let pares = [
            // Pares Originales (6 Pares)
            [48, 72],     // MCD 24
            [60, 90],     // MCD 30
            [84, 126],    // MCD 42
            [45, 75],     // MCD 15
            [54, 81],     // MCD 27
            [30, 45],     // MCD 15

            // Pares Adicionales con MCD = 15 (28 Pares)
            [15, 30],     // 15*1, 15*2
            [15, 60],     // 15*1, 15*4
            [15, 120],    // 15*1, 15*8
            [15, 165],    // 15*1, 15*11
            [30, 75],     // 15*2, 15*5
            [30, 105],    // 15*2, 15*7
            [45, 60],     // 15*3, 15*4
            [45, 120],    // 15*3, 15*8
            [60, 75],     // 15*4, 15*5
            [60, 105],    // 15*4, 15*7
            [75, 90],     // 15*5, 15*6
            [75, 120],    // 15*5, 15*8
            [105, 135],   // 15*7, 15*9
            [120, 135],   // 15*8, 15*9
            [15, 210],    // 15*1, 15*14
            [30, 195],    // 15*2, 15*13
            [45, 150],    // 15*3, 15*10
            [60, 165],    // 15*4, 15*11
            [75, 180],    // 15*5, 15*12
            [105, 120],   // 15*7, 15*8
            [105, 165],   // 15*7, 15*11
            [120, 195],   // 15*8, 15*13
            [135, 150],   // 15*9, 15*10
            [135, 210],   // 15*9, 15*14
            [150, 195],   // 15*10, 15*13
            [165, 180],   // 15*11, 15*12
            [165, 210],   // 15*11, 15*14
            [195, 210],   // 15*13, 15*14
            
            // Pares Adicionales con otros MCDs (4 de cada uno)
            // MCD = 24
            [24, 48],     // 24*1, 24*2
            [24, 120],    // 24*1, 24*5
            [48, 120],    // 24*2, 24*5
            [72, 120],    // 24*3, 24*5

            // MCD = 27
            [27, 54],     // 27*1, 27*2
            [27, 108],    // 27*1, 27*4
            [54, 135],    // 27*2, 27*5
            [108, 135],   // 27*4, 27*5

            // MCD = 30
            [30, 120],    // 30*1, 30*4
            [60, 150],    // 30*2, 30*5
            [90, 120],    // 30*3, 30*4
            [150, 210],   // 30*5, 30*7

            // MCD = 42
            [42, 84],     // 42*1, 42*2
            [42, 210],    // 42*1, 42*5
            [84, 126],    // 42*2, 42*3
            [126, 210]    // 42*3, 42*5
        ];
let actual = 0;
let n1, n2, mcd = 1;
let factoresUsados = [];

function iniciarMision(){
  if(actual >= pares.length) actual = 0;
  [n1, n2] = pares[actual];
  mcd = 1;
  factoresUsados = [];
  document.getElementById("num1").textContent = n1;
  document.getElementById("num2").textContent = n2;
  document.getElementById("btnSiguiente").style.display = "none";
  document.getElementById("astronauta").style.opacity = 0;
  document.getElementById("panelFactores").querySelector("#listaFactores").innerHTML = "";
  document.getElementById("panelFactores").querySelector("#divisiones").innerHTML = "";
  document.getElementById("panelFactores").querySelector("#productoMCD").innerHTML = "";
  narrar(`Iniciando misión ${actual+1}. Descompón simultáneamente los números ${n1} y ${n2}.`);
}

function arrastrar(ev){ ev.dataTransfer.setData("text", ev.target.id); }
function permitirDrop(ev){ ev.preventDefault(); }

function soltar(ev){
  ev.preventDefault();
  const id = ev.dataTransfer.getData("text");
  const factor = parseInt(document.getElementById(id).textContent);
  const sndOk = document.getElementById("sndOk");
  const sndErr = document.getElementById("sndError");

  let divide1 = n1 % factor === 0;
  let divide2 = n2 % factor === 0;

  if(divide1 && divide2){
    const oldN1 = n1, oldN2 = n2;
    n1 /= factor; n2 /= factor; mcd *= factor;
    factoresUsados.push(factor);
    actualizarCapsulas();
    actualizarPanel(oldN1, oldN2, factor);
    narrar(`Excelente. El ${factor} divide a ambos números.`);
    sndOk.play();
    if(!tieneComunes()) completarMision();
  } else if(divide1 || divide2){
    narrar(`El ${factor} divide solo a uno de los números. Busca un divisor común.`);
    sndErr.play();
  } else {
    narrar(`El ${factor} no divide a ninguno. Intenta otro.`);
    sndErr.play();
  }
}

function actualizarCapsulas(){
  let c1 = document.getElementById("num1");
  let c2 = document.getElementById("num2");
  c1.textContent = n1;
  c2.textContent = n2;
  c1.classList.add("reducida");
  c2.classList.add("reducida");
  setTimeout(()=>{ c1.classList.remove("reducida"); c2.classList.remove("reducida"); },500);
}

function actualizarPanel(prev1, prev2, factor){
  const divs = document.getElementById("divisiones");
  const lista = document.getElementById("listaFactores");
  const prod = document.getElementById("productoMCD");

  divs.innerHTML += `🧩 ${prev1} ÷ ${factor} = ${n1}<br>🧩 ${prev2} ÷ ${factor} = ${n2}<br>`;
  lista.innerHTML = `Factores comunes: ${factoresUsados.join(" × ")}`;
  prod.innerHTML = `Producto parcial: ${mcd}`;
}

function tieneComunes(){
  const primos = [2,3,5,7,11];
  return primos.some(p => n1 % p === 0 && n2 % p === 0);
}

function completarMision(){
  narrar(`¡Misión completada! El M.C.D. de los números es ${mcd}, formado por los factores ${factoresUsados.join(", ")}.`);
  document.getElementById("astronauta").style.opacity = 1;
  document.getElementById("sndSuccess").play();
  document.getElementById("btnSiguiente").style.display = "inline-block";
  document.getElementById("panelFactores").querySelector("#productoMCD").innerHTML += `<br>✅ <b>El M.C.D. final es ${mcd}</b>`;
}

function nuevaMision(){
  actual++;
  iniciarMision();
}

function narrar(texto){
  const consola = document.getElementById("consola");
  const linea = document.createElement("div");
  consola.appendChild(linea);
  consola.scrollTop = consola.scrollHeight;

  const voz = new SpeechSynthesisUtterance(texto);
  voz.lang = "es-ES";
  voz.pitch = 0.6;
  voz.rate = 0.85;
  speechSynthesis.speak(voz);

  let i = 0;
  function typeWriter(){
    if(i < texto.length){
      linea.innerHTML = texto.substring(0,i+1) + '<span class="cursor"></span>';
      i++;
      setTimeout(typeWriter, 40);
    } else {
      linea.innerHTML = texto;
    }
  }
  typeWriter();
}

window.onload = iniciarMision;
</script>
</body>
</html>

<style>
  body { font-family: Arial, sans-serif; margin: 20px; background:#f9f9f9; }

  label { font-weight: bold; }
  select, input, button { padding: 8px; border-radius: 6px; border: 1px solid #999; }
  .resultado { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 5px rgba(0,0,0,0.2); max-width: 900px; margin: auto; }
  .resultado h2 { color: #006699; margin-top:0; }
  .campo { margin: 10px 0; }
  .campo strong { color: #333; }
  #graficoNiveles { display: block; margin: 40px auto; max-width: 700px; }
  button { background:#006699; color:white; cursor:pointer; border:none; margin-top:10px; }
  button:hover { background:#004d66; }
  #busqueda { width: 50%; }

  /* Responsive */
  @media (max-width: 768px) {
    .filtros { flex-direction: column; align-items: center; }
    select, input, button { width: 90%; margin-bottom: 10px; }
    .resultado { padding: 15px; font-size: 14px; }
  }
</style>
</head>
<body>

<h1>Visor Interactivo de Descriptores y Bloom</h1>

<div class="filtros">
  <label>Área:
    <select id="areaSelect"><option value="">-- Seleccionar --</option></select>
  </label>
  <label>Grado:
    <select id="gradoSelect"><option value="">-- Seleccionar --</option></select>
  </label>
  <label>Nivel:
    <select id="nivelSelect"><option value="">-- Seleccionar --</option></select>
  </label>
</div>

<!-- 🔎 Buscador -->
<div style="text-align:center;margin-bottom:20px;">
  <input type="text" id="busqueda" placeholder="Buscar palabra clave (ej: argumentar, energía, probabilidad)">
  <button id="btnBuscar">🔎 Buscar</button>
</div>

<div id="resultado" class="resultado">
  <h2>Resultados</h2>
  <div class="campo"><strong>Descriptor oficial:</strong> <span id="descriptor"></span></div>
  <div class="campo"><strong>Verbo Bloom:</strong> <span id="bloom"></span></div>
  <div class="campo"><strong>Tarea/Pregunta:</strong> <span id="tarea"></span></div>
  <div class="campo"><strong>Actividades/Refuerzos:</strong> <span id="actividades"></span></div>
  <button id="btnPDF">💾 Exportar a PDF</button>
</div>

<canvas id="graficoNiveles"></canvas>


<!-- ==================== ANÁLISIS DE DOMINIO INTRA-NIVEL ==================== -->
<div class="resultado" id="analitica" style="margin-top:30px;">
  <h2>Analítica de dominio intra-nivel</h2>
  <div style="display:flex;flex-wrap:wrap;align-items:center;gap:10px;">
    <label><strong>Puntaje:</strong>
      <input id="scoreInput" type="number" min="0" max="100" step="1"
             style="padding:6px;border:1px solid #aaa;border-radius:6px;width:100px;margin-left:6px;">
    </label>
    <button id="analizarBtn" style="background:#006699;color:white;border:none;border-radius:6px;padding:8px 12px;cursor:pointer;">
      Analizar dominio
    </button>
  </div>
  <div id="analisisOut" style="margin-top:15px;"></div>
  <div id="tareasOut" style="margin-top:10px;"></div>
</div>

/* ======= FILTROS Y VISUALIZACIÓN ======= */
const areaSelect = document.getElementById("areaSelect");
const gradoSelect = document.getElementById("gradoSelect");
const nivelSelect = document.getElementById("nivelSelect");

const uniqueAreas = [...new Set(data.map(d => d["Área"]))].sort();
uniqueAreas.forEach(a => areaSelect.innerHTML += `<option value="${a}">${a}</option>`);

areaSelect.addEventListener("change", () => {
  gradoSelect.innerHTML = "<option value=''>-- Seleccionar --</option>";
  nivelSelect.innerHTML = "<option value=''>-- Seleccionar --</option>";
  const grados = [...new Set(data.filter(d => d["Área"] === areaSelect.value).map(d => d["Grado"]))];
  grados.forEach(g => gradoSelect.innerHTML += `<option value="${g}">${g}</option>`);
});

gradoSelect.addEventListener("change", () => {
  nivelSelect.innerHTML = "<option value=''>-- Seleccionar --</option>";
  const niveles = [...new Set(data.filter(d => d["Área"] === areaSelect.value && d["Grado"] === gradoSelect.value).map(d => d["Nivel"]))];
  niveles.forEach(n => nivelSelect.innerHTML += `<option value="${n}">${n}</option>`);
  actualizarGrafico(areaSelect.value, gradoSelect.value);
});

nivelSelect.addEventListener("change", mostrarResultado);

function mostrarResultado() {
  const registro = data.find(d =>
    d["Área"] === areaSelect.value &&
    d["Grado"] === gradoSelect.value &&
    String(d["Nivel"]) === nivelSelect.value
  );

  document.getElementById("descriptor").textContent = registro ? registro["Descriptor oficial"] : "";
  document.getElementById("tarea").textContent      = registro ? registro["Tarea/Pregunta"] : "";
  document.getElementById("actividades").textContent= registro ? registro["Actividades/Refuerzos"] : "";

  // ====== BLOOM EXTENDIDO SABER–HACER–SER ======
  const nivelNum = Number(nivelSelect.value);                 // NaN si es "A1", "B1", etc.
  const esNivelCognitivo = [1,2,3,4].includes(nivelNum);
  let bloomHTML = "";

  if (esNivelCognitivo && BLOOM_DIM.saber[nivelNum]) {
    bloomHTML += `<div style="background:#E3F2FD;padding:8px;border-radius:6px;margin-bottom:4px;">
      🧠 <strong>SABER (Nivel ${nivelNum}):</strong> ${SHS.saber[nivelNum].join(", ")}
    </div>`;
  }
  if (esNivelCognitivo && SHS.hacer[nivelNum]) {
    bloomHTML += `<div style="background:#E8F5E9;padding:8px;border-radius:6px;margin-bottom:4px;">
      🛠️ <strong>HACER (Nivel ${nivelNum}):</strong> ${SHS.hacer[nivelNum].join(", ")}
    </div>`;
  }
  if (esNivelCognitivo && SHS.ser[nivelNum]) {
    bloomHTML += `<div style="background:#FFF8E1;padding:8px;border-radius:6px;">
      💫 <strong>SER (Nivel ${nivelNum}):</strong> ${SHS.ser[nivelNum].join(", ")}
    </div>`;
  }

  // Si no es 1–4 (p.ej., A1/B1), mostramos el Bloom original del registro
  document.getElementById("bloom").innerHTML = bloomHTML || (registro ? registro["Verbo Bloom"] : "");
}

/* ======= GRÁFICO DE NIVELES (versión cognitiva) ======= */
let grafico;
function actualizarGrafico(area, grado) {
  const conteo = [1,2,3,4].map(n =>
    data.filter(d =>
      d["Área"]===area &&
      d["Grado"]===grado &&
      String(d["Nivel"])===String(n)
    ).length
  );

  const ctx = document.getElementById("graficoNiveles");
  if (grafico) grafico.destroy();
  grafico = new Chart(ctx, {
    type: "bar",
    data: {
      labels: ["Nivel 1","Nivel 2","Nivel 3","Nivel 4"],
      datasets: [{
        label: `N.º de tareas por nivel – ${area} (${grado})`,
        data: conteo,
        backgroundColor: ["#BBDEFB","#C8E6C9","#FFF9C4","#FFCDD2"],
        borderColor: "#333",
        borderWidth: 1
      }]
    },
    options: {
      responsive:true,
      plugins:{
        legend:{display:false},
        title:{display:true, text:"Complejidad cognitiva (más alto = más tareas)"},
        tooltip:{callbacks:{label:(ctx)=>` ${ctx.raw} tareas en este nivel`}}
      },
      scales:{ y:{beginAtZero:true, ticks:{stepSize:1}} }
    }
  });
}

function ejecutarBusqueda() {
  const palabra = document.getElementById("busqueda").value.toLowerCase().trim();

  const resultados = data.filter(d =>

  if (resultados.length === 0) return alert("No se encontraron coincidencias.");

  document.getElementById("actividades").textContent = r["Actividades/Refuerzos"];
}

/* ===================== FUNCIONES DE CÁLCULO ===================== */
function obtenerRango(area, grado, puntaje) {
  const rangos = RANGOS[area]?.[grado];
  return rangos ? rangos.find(r => puntaje >= r.min && puntaje <= r.max) : null;
}

function pctIntraNivel(puntaje, min, max) {
  if (puntaje < min) return 0;
  if (puntaje > max) return 100;
  return ((puntaje - min) / (max - min)) * 100;
}

function pctUnPunto(min, max) {
  return 100 / (max - min);
}

function tareasDominadas(area, grado, nivel, pct) {
  const lista = TAREAS[area]?.[grado]?.[nivel] || [];
  const dominadas = lista.slice(0, Math.floor((pct / 100) * lista.length));
  const pendientes = lista.slice(dominadas.length);
  return { dominadas, pendientes };
}

/* ===================== EVENTO DEL BOTÓN DE ANÁLISIS ===================== */
document.getElementById("analizarBtn").addEventListener("click", () => {
  const area = areaSelect.value;
  const grado = gradoSelect.value;
  const puntaje = Number(document.getElementById("scoreInput").value);
  const salida = document.getElementById("analisisOut");
  const tareas = document.getElementById("tareasOut");
  salida.innerHTML = tareas.innerHTML = "";

  if (!area || !grado || isNaN(puntaje)) {
    salida.innerHTML = "<div style='color:#b00;'>Selecciona un área, grado y puntaje válido.</div>";
    return;
  }

  const rango = obtenerRango(area, grado, puntaje);
  if (!rango) {
    salida.innerHTML = `<div style='color:#b00;'>No hay rangos definidos para ${area} – ${grado}.</div>`;
    return;
  }

  const pct = pctIntraNivel(puntaje, rango.min, rango.max);
  const unPuntoPct = pctUnPunto(rango.min, rango.max);
  const faltan = (rango.max - puntaje).toFixed(1);

  salida.innerHTML = `
    <div><strong>Área:</strong> ${area} | <strong>Grado:</strong> ${grado}</div>
    <div><strong>Nivel actual:</strong> ${rango.nivel} (${rango.min}–${rango.max})</div>
    <div><strong>Puntaje:</strong> ${puntaje}</div>
    <div><strong>Dominio intra-nivel:</strong> ${pct.toFixed(2)}%</div>
    <div><strong>1 punto representa:</strong> ${unPuntoPct.toFixed(2)}% del nivel</div>
    <div><strong>Faltan:</strong> ${faltan} puntos para llegar al tope del nivel.</div>
    <div style="background:#eee;height:10px;border-radius:6px;margin-top:8px;">
      <div style="height:10px;width:${pct}%;background:#2e7d32;border-radius:6px;"></div>
    </div>
  `;

  const { dominadas, pendientes } = tareasDominadas(area, grado, rango.nivel, pct);
  if (dominadas.length || pendientes.length) {
    tareas.innerHTML = `
      <h3 style="margin-top:15px;color:#006699;">Evidencias del nivel ${rango.nivel}</h3>
      <div style="display:flex;flex-wrap:wrap;gap:20px;">
        <div><strong>✔ Dominadas</strong>
          <ul>${dominadas.map(t => `<li>${t}</li>`).join("") || "<li>Ninguna aún</li>"}</ul>
        </div>
        <div><strong>⏳ Pendientes</strong>
          <ul>${pendientes.map(t => `<li>${t}</li>`).join("") || "<li>Completadas</li>"}</ul>
        </div>
      </div>
    `;
  }

  const det = DETALLES[area]?.[grado];
  if (det) {
    let tabla = "<h3 style='margin-top:20px;color:#006699;'>Descriptores detallados por nivel</h3>";
    for (let i = 1; i <= 4; i++) {
      const color = ["#E3F2FD","#E8F5E9","#FFF8E1","#F3E5F5"][i - 1];
      const items = det[i] || [];
      tabla += `<div style="background:${color};padding:8px;border-radius:6px;margin-top:6px;">
        <strong>Nivel ${i}:</strong> ${items.length ? "<ul>" + items.map(t=>`<li>${t}</li>`).join("") + "</ul>" : "<em>Sin descriptores detallados</em>"}
      </div>`;
    }
    tareas.innerHTML += tabla;
  }
});
